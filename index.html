<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ツモログ</title>
<style>
/*
 * ╔══════════════════════════════════════════════════════════╗
 * ║  ツモログ トップページ (index.html)                      ║
 * ║                                                           ║
 * ║  3つのアプリへのナビゲーション:                          ║
 * ║    ✍️  paifu-input.html — 牌譜入力                       ║
 * ║    ▶️  paifu-play.html  — 牌譜再生（プレミアム）         ║
 * ║    ⭐  paifu-shop.html  — ポイントショップ               ║
 * ║                                                           ║
 * ║  プレミアム判定:                                          ║
 * ║    localStorage "tsumolog_flags" の                       ║
 * ║    subscribe_month / subscribe_year の有効期限で判断      ║
 * ╚══════════════════════════════════════════════════════════╝
 */
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=DM+Mono:wght@400;500&display=swap');

:root{
  --bg:#0c0b09;
  --sf:#161410;
  --bd:rgba(255,255,255,.08);
  --tx:#f0e8d0;
  --tx2:#a89870;
  --tx3:#5a5040;
  --gold:#c8983a;
  --gold2:#e8b84a;
  --r:#c04040;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--tx);
  font-family:'Shippori Mincho',serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* 背景の牌模様 */
body::before{
  content:'';
  position:fixed;inset:0;z-index:0;
  background-image:
    radial-gradient(ellipse 60% 40% at 20% 30%, rgba(200,152,58,.06) 0%, transparent 70%),
    radial-gradient(ellipse 40% 60% at 80% 70%, rgba(192,64,64,.04) 0%, transparent 70%);
  pointer-events:none;
}

/* 牌グリッド背景 */
.tile-bg{
  position:fixed;inset:0;z-index:0;
  display:grid;
  grid-template-columns:repeat(auto-fill,28px);
  gap:6px;padding:20px;
  opacity:.025;pointer-events:none;
  overflow:hidden;
}
.tile-bg span{font-size:22px;color:var(--tx);}

.wrap{
  position:relative;z-index:1;
  max-width:480px;margin:0 auto;
  padding:0 20px 48px;
  min-height:100vh;
  display:flex;flex-direction:column;
}

/* ヘッダー */
header{
  padding:48px 0 32px;
  text-align:center;
}
.logo-jp{
  font-size:13px;letter-spacing:.4em;color:var(--tx2);
  margin-bottom:12px;display:block;
}
.logo-main{
  font-size:44px;font-weight:700;color:var(--gold2);
  letter-spacing:.1em;line-height:1;
  text-shadow:0 0 40px rgba(232,184,74,.2);
}
.logo-en{
  font-family:'DM Mono',monospace;
  font-size:11px;letter-spacing:.3em;color:var(--tx3);
  margin-top:8px;display:block;text-transform:uppercase;
}

/* 区切り線 */
.divider{
  display:flex;align-items:center;gap:12px;
  margin:0 0 32px;
}
.divider::before,.divider::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--bd),transparent);
}
.divider-tile{font-size:16px;color:var(--tx3);}

/* アプリカード */
.cards{display:flex;flex-direction:column;gap:12px;flex:1;}

.card{
  display:flex;align-items:center;gap:16px;
  padding:20px;
  background:var(--sf);
  border:1px solid var(--bd);
  border-radius:12px;
  text-decoration:none;
  color:inherit;
  transition:border-color .2s, transform .15s, background .2s;
  position:relative;overflow:hidden;
}
.card::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.03),transparent);
  pointer-events:none;
}
.card:hover{
  border-color:var(--gold);
  background:#1c1a14;
  transform:translateY(-2px);
}
.card:active{transform:translateY(0);}

.card-icon{
  font-size:32px;
  width:52px;height:52px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.04);
  border-radius:10px;
  border:1px solid var(--bd);
}
.card-body{flex:1;}
.card-name{
  font-size:17px;font-weight:700;
  color:var(--tx);margin-bottom:4px;
}
.card-name-en{
  font-family:'DM Mono',monospace;
  font-size:10px;color:var(--gold);letter-spacing:.15em;
  text-transform:uppercase;margin-bottom:6px;
}
.card-desc{font-size:12px;color:var(--tx2);line-height:1.6;}
.card-arrow{
  font-size:16px;color:var(--tx3);flex-shrink:0;
  transition:transform .2s, color .2s;
}
.card:hover .card-arrow{transform:translateX(4px);color:var(--gold);}

/* バッジ */
.badge{
  display:inline-block;
  font-family:'DM Mono',monospace;font-size:9px;
  padding:2px 7px;border-radius:10px;
  margin-left:8px;vertical-align:middle;
  letter-spacing:.05em;
}
.badge-main{background:rgba(200,152,58,.15);color:var(--gold);border:1px solid rgba(200,152,58,.3);}
.badge-new{background:rgba(192,64,64,.15);color:#e06060;border:1px solid rgba(192,64,64,.3);}
.badge-lock{background:rgba(90,80,64,.3);color:var(--tx3);border:1px solid rgba(90,80,64,.4);}
.badge-ok{background:rgba(80,160,100,.15);color:#60c080;border:1px solid rgba(80,160,100,.3);}
.card.locked{opacity:.7;}
.card.locked:hover{border-color:var(--bd);transform:none;background:var(--sf);}

/* フッター */
footer{
  text-align:center;
  padding:32px 0 0;
  font-family:'DM Mono',monospace;
  font-size:10px;color:var(--tx3);
  letter-spacing:.1em;
}
.footer-pts{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--sf);border:1px solid var(--bd);
  border-radius:20px;padding:6px 14px;margin-bottom:16px;
  font-size:12px;
}
.footer-pts .star{color:var(--gold);}
.footer-pts .num{color:var(--gold2);font-size:14px;}

/* ポイント残高 */
#pts-display{color:var(--gold2);}

/* アニメーション */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px);}
  to{opacity:1;transform:translateY(0);}
}
header{animation:fadeUp .5s ease both;}
.divider{animation:fadeUp .5s .1s ease both;opacity:0;}
.card:nth-child(1){animation:fadeUp .5s .15s ease both;opacity:0;}
.card:nth-child(2){animation:fadeUp .5s .22s ease both;opacity:0;}
.card:nth-child(3){animation:fadeUp .5s .29s ease both;opacity:0;}
footer{animation:fadeUp .5s .35s ease both;opacity:0;}
</style>
</head>
<body>

<!-- 背景牌 -->
<div class="tile-bg" id="tile-bg"></div>

<div class="wrap">
  <header>
    <span class="logo-jp">麻雀牌譜クラウドソーシング</span>
    <div class="logo-main">ツモログ</div>
    <span class="logo-en">Tsumolog</span>
  </header>

  <div class="divider"><span class="divider-tile">🀄</span></div>

  <div class="cards">

    <a class="card" href="paifu-input.html">
      <div class="card-icon">✍️</div>
      <div class="card-body">
        <div class="card-name-en">Kifu Input</div>
        <div class="card-name">牌譜入力<span class="badge badge-main">MAIN</span></div>
        <div class="card-desc">牌譜を入力してポイントを獲得。配牌・ツモ・捨て牌・副露・アガリを記録します。</div>
      </div>
      <div class="card-arrow">›</div>
    </a>

    <div class="card" id="card-paihu" onclick="openPaihu()" style="cursor:pointer">
      <div class="card-icon">▶️</div>
      <div class="card-body">
        <div class="card-name-en">Paihu Replay</div>
        <div class="card-name">牌譜再生 <span class="badge badge-lock" id="paihu-badge">🔒 プレミアム</span></div>
        <div class="card-desc" id="paihu-desc">収集した牌譜をステップ再生。月額・年額プランでご利用いただけます。</div>
      </div>
      <div class="card-arrow">›</div>
    </div>

    <a class="card" href="paifu-shop.html">
      <div class="card-icon">⭐</div>
      <div class="card-body">
        <div class="card-name-en">Premium Shop</div>
        <div class="card-name">ポイントショップ<span class="badge badge-new">NEW</span></div>
        <div class="card-desc">貯めたポイントで牌譜DLや月額プランを購入。獲得ポイントの履歴も確認できます。</div>
      </div>
      <div class="card-arrow">›</div>
    </a>

  </div>

  <footer>
    <div class="footer-pts">
      <span class="star">⭐</span>
      <span>保有ポイント</span>
      <span class="num" id="pts-display">-</span>
      <span style="color:var(--tx3)">pt</span>
    </div>
    <div>© 2025 Tsumolog · RMU</div>
  </footer>
</div>

<script>
// ─────────────────────────────────────────────────────
// § 1. 背景装飾: ランダムな牌絵文字をグリッド状に配置
// ─────────────────────────────────────────────────────
// 背景牌タイル
var tiles=['🀇','🀈','🀉','🀊','🀋','🀌','🀍','🀎','🀏',
           '🀙','🀚','🀛','🀜','🀝','🀞','🀟','🀠','🀡',
           '🀐','🀑','🀒','🀓','🀔','🀕','🀖','🀗','🀘',
           '🀀','🀁','🀂','🀃','🀄','🀅','🀆'];
var bg=document.getElementById('tile-bg');
for(var i=0;i<120;i++){
  var s=document.createElement('span');
  s.textContent=tiles[Math.floor(Math.random()*tiles.length)];
  bg.appendChild(s);
}

// ─────────────────────────────────────────────────────
// § 2. フッターのポイント残高表示
// ─────────────────────────────────────────────────────
// ポイント表示
try{
  var u=JSON.parse(localStorage.getItem('tsumolog_user')||'null');
  document.getElementById('pts-display').textContent=u?(u.points||0).toLocaleString():'0';
}catch(e){}

// ─────────────────────────────────────────────────────
// § 3. 牌譜再生へのアクセス制御
// ─────────────────────────────────────────────────────
// 牌譜再生アクセス制御
function hasPremium(){
  try{
    var flags=JSON.parse(localStorage.getItem('tsumolog_flags')||'{}');
    var now=Date.now();
    return (flags['subscribe_month']&&flags['subscribe_month'].expiresAt>now)
        || (flags['subscribe_year'] &&flags['subscribe_year'].expiresAt>now);
  }catch(e){return false;}
}

function openPaihu(){
  if(hasPremium()){
    location.href='paifu-play.html';
  } else {
    // ショップへ誘導
    if(confirm('牌譜再生はプレミアムプランが必要です。
ポイントショップで購入しますか？')){
      location.href='paifu-shop.html';
    }
  }
}

// バッジを課金状態に応じて更新
(function(){
  var badge=document.getElementById('paihu-badge');
  var desc=document.getElementById('paihu-desc');
  var card=document.getElementById('card-paihu');
  if(hasPremium()){
    badge.textContent='✅ 利用可能';
    badge.className='badge badge-ok';
    desc.textContent='収集した牌譜をステップ再生。手牌・捨て牌・副露をビジュアルで確認できます。';
  } else {
    card.classList.add('locked');
  }
})();
</script>
</body>
</html>
