        +'<div style="font-size:11px;color:var(--tx3);margin-bottom:5px">② どうやって</div>'
        +'<div style="display:flex;gap:6px">'+howBtn+'</div></div>';
    }

    // ③ 誰から（ロン時）
    var fromSection='';
    if(ag.type==="ロン"&&!isRyukyoku){
      var fromBtn=WJseats.filter(function(s){return s!==ag.who;}).map(function(seat){
        var on=ag.from===seat;
        return'<button onclick="state.agari.from=\''+seat+'\';renderSection()"'
          +' style="flex:1;padding:9px;border-radius:var(--ra);font-size:13px;font-family:inherit;cursor:pointer;'
          +'background:'+(on?'var(--r-bg)':'var(--sf)')+';border:'+(on?'1.5px solid var(--r)':'.5px solid var(--bd2)')+';'
          +'color:'+(on?'var(--r)':'var(--tx)')+'">'+seat+'</button>';
      }).join('');
      fromSection='<div style="margin-top:12px">'
        +'<div style="font-size:11px;color:var(--tx3);margin-bottom:5px">③ 誰から（放銃者）</div>'
        +'<div style="display:flex;gap:6px">'+fromBtn+'</div></div>';
    }

    // ④ 点数 / 役（流局以外）
    var scoreSection='';
    if(!isRyukyoku){
      var scoreColor=ag.score&&ag.score.startsWith("+")?'var(--g)':ag.score&&ag.score.startsWith("-")?'var(--r)':'var(--tx)';
      // 点数プリセットボタン
      var presetKey=(ag.who==="東家"?"east":"noneast")+"_"+(ag.type==="ツモ"?"tsumo":"ron");
      var presets=SCORE_PRESETS[presetKey]||[];
      var presetBtns=presets.length
        ?'<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px">'
          +presets.map(function(v){
            var on=ag.score===v;
            return'<button onclick="state.agari.score=\''+v+'\';renderNav();renderSection()"'
              +' style="padding:4px 10px;border-radius:6px;font-size:13px;font-family:inherit;cursor:pointer;'
              +'background:'+(on?'var(--b)':'var(--sf)')+';border:'+(on?'1px solid var(--b)':'.5px solid var(--bd2)')+';'
              +'color:'+(on?'#e6f1fb':'var(--tx)')+'">'+v+'</button>';
          }).join('')
          +'</div>'
        :'';
      // 役満リストを分離
      var YAKUMAN_SET=['国士無双','九蓮宝燈','四暗刻','大三元','小四喜','大四喜',
        '字一色','緑一色','清老頭','四槓子','天和','地和',
        '国士無双十三面','純正九蓮宝燈','四暗刻単騎','大車輪','小三元','混老頭'];
      function isYakuman(y){
        return (y.cls&&y.cls.indexOf('yakuman')>=0)||YAKUMAN_SET.indexOf(y.name)>=0;
      }
      // 役ボタン: 未選択のみ表示、選択済みはバッジで上部表示
      var selectedYaku=ag.yaku?ag.yaku.split(/[・,，、]/).map(function(s){return s.trim();}).filter(Boolean):[];
      // 選択済み役バッジ（✕付き）
      // ドラ系は個数をまとめて表示、非ドラは1個ずつ
      var yakuSelected=(function(){
        if(!selectedYaku.length) return '';
        // ドラ系を集計
        var doraCounts={};
        var nonDora=[];
        selectedYaku.forEach(function(name){
          if(DORA_NAMES.indexOf(name)>=0){
            doraCounts[name]=(doraCounts[name]||0)+1;
          } else {
            nonDora.push(name);
          }
        });
        var badges='';
        // 非ドラ
        nonDora.forEach(function(name){
          badges+='<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;'
            +'background:var(--tl);color:#fff;font-size:12px">'
            +name
            +'<span onclick="removeYakuOne(\''+name+'\');" '
            +'style="cursor:pointer;font-size:12px;line-height:1;opacity:.8">✕</span>'
            +'</span>';
        });
        // ドラ系（個数付き）
        Object.keys(doraCounts).forEach(function(name){
          var n=doraCounts[name];
          badges+='<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;'
            +'background:var(--gold);color:#fff;font-size:12px">'
            +name+(n>1?' ×'+n:'')
            +'<span onclick="toggleYaku(\''+name+'\');" title="+1" '
            +'style="cursor:pointer;font-size:14px;line-height:1;opacity:.9;margin-left:1px">＋</span>'
            +'<span onclick="removeYakuOne(\''+name+'\');" title="-1" '
            +'style="cursor:pointer;font-size:12px;line-height:1;opacity:.8">✕</span>'
            +'</span>';
        });
        return '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px">'+badges+'</div>';
      })();
      // 未選択の役ボタン（役満は折りたたむ）
      var normalYaku=YAKU_LIST.filter(function(y){return !isYakuman(y)&&(DORA_NAMES.indexOf(y.name)>=0||selectedYaku.indexOf(y.name)<0);});
      var yakumanYaku=YAKU_LIST.filter(function(y){return isYakuman(y)&&selectedYaku.indexOf(y.name)<0;});
      var isYakumanOpen=!!(state.yakumanOpen);
      var yakuBtns=YAKU_LIST.length
        ?'<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px">'
          +normalYaku.map(function(y){
            return'<button onclick="toggleYaku(\''+y.name+'\')"'
              +' style="padding:3px 8px;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer;'
              +'background:var(--sf);border:.5px solid var(--bd2);color:var(--tx)">'+y.name+'</button>';
          }).join('')
          // 役満トグルボタン
          +'<button onclick="state.yakumanOpen=!state.yakumanOpen;renderSection()"'
          +' style="padding:3px 8px;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer;'
          +'background:'+(isYakumanOpen?'var(--gold)':'var(--sf)')+';'
          +'border:1px solid '+(isYakumanOpen?'var(--gold)':'var(--bd2)')+';'
          +'color:'+(isYakumanOpen?'#fff':'var(--tx)')+'">役満 '+(isYakumanOpen?'▲':'▼')+'</button>'
          +'</div>'
          // 役満プルダウン
          +(isYakumanOpen&&yakumanYaku.length
            ?'<div style="background:var(--gold-bg);border:1px solid var(--gold);border-radius:var(--ra);padding:8px;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:4px">'
              +yakumanYaku.map(function(y){
                return'<button onclick="toggleYaku(\''+y.name+'\');state.yakumanOpen=false;renderSection()"'
                  +' style="padding:3px 10px;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer;'
                  +'background:#fff;border:1px solid var(--gold);color:var(--gold)">'+y.name+'</button>';
              }).join('')
              +(yakumanYaku.length===0?'<span style="font-size:11px;color:var(--tx3)">全て選択済み</span>':'')
              +'</div>'
            :'')
        :'';
      var scoreColor=ag.score&&!isNaN(parseInt(ag.score))?'var(--g)':'var(--tx)';
      scoreSection='<div style="margin-top:12px;padding-top:12px;border-top:.5px solid var(--bd)">'
        +'<div style="font-size:11px;color:var(--tx3);margin-bottom:5px">④ 点数</div>'
        +(presets.length===0
          ? '<div style="font-size:12px;color:var(--tx3);padding:4px 0 8px">先に「誰が」「どうやって」を選択してください</div>'
          : presetBtns
        )
        // 自由入力（プリセットにない点数や微調整用）
        +'<input type="text" value="'+(ag.score||'')+'" oninput="state.agari.score=this.value;renderNav()" placeholder="例: 3900 / 1300-2600"'
        +' style="width:100%;font-size:17px;font-weight:700;color:'+scoreColor
        +';background:var(--sf);border:.5px solid var(--bd2);border-radius:var(--ra);'
        +'padding:7px 10px;font-family:inherit;outline:none;box-sizing:border-box;margin-bottom:8px">'
        +'<div style="margin-top:4px;padding-top:10px;border-top:.5px solid var(--bd)">'
        +'<div style="font-size:11px;color:var(--tx3);margin-bottom:5px">役</div>'
        +yakuSelected+yakuBtns
        +'</div>'
        +'</div>';
    }

    // 矛盾チェック
    var consistencyWarnings=checkInputConsistency();
    var warningHtml=consistencyWarnings.length
      ?'<div style="background:#fff8e1;border:.5px solid #f0c040;border-radius:var(--ra);padding:8px 12px;margin-bottom:10px">'
        +consistencyWarnings.map(function(w){
          return'<div style="font-size:12px;color:#a06000;margin-bottom:2px">'+w+'</div>';
        }).join('')
        +'</div>'
      :'';

    // サマリー
    var summary='';
    if(ag.who){
      var parts=[];
      parts.push(ag.who);
      if(!isRyukyoku&&ag.type)parts.push(ag.type+(ag.type==="ロン"&&ag.from?"（"+ag.from+"から）":""));
      if(!isRyukyoku&&ag.score)parts.push(ag.score+"点");
      if(isRyukyoku){
        var tp=Object.keys(ag.tenpaiMap||{}).filter(function(k){return ag.tenpaiMap[k];});
        if(tp.length)parts.push("テンパイ: "+tp.join("・"));
      }
      summary='<div style="background:var(--g-bg);border:.5px solid var(--g);border-radius:var(--ra);'
        +'padding:8px 12px;margin-bottom:12px;font-size:13px;color:var(--g);font-weight:600">'
        +parts.join(" / ")+'</div>';
    }

    // 確定ボタン
    var agariDone=!!confirmedSections['agari'];
    var confirmBtn='<button onclick="confirmSection(\'agari\')"'
      +' style="width:100%;margin-top:14px;padding:13px;border-radius:var(--ra);'
      +'background:'+(agariDone?'var(--g)':'var(--b)')+';border:none;color:#e6f1fb;font-size:15px;'
      +'font-weight:600;font-family:inherit;cursor:pointer">'
      +(agariDone?'✅ アガリ情報 確定済み':'✓ アガリ情報を確定')+'</button>';

    h='<div class="card">'
      +'<div class="slabel">🏆 アガリ・点数</div>'
      +warningHtml
      +summary
      +'<div style="font-size:11px;color:var(--tx3);margin-bottom:5px">① 誰が（または流局）</div>'
      +'<div style="display:flex;gap:4px;margin-bottom:4px">'+whoBtn+'</div>'
      +tenpaiSection
      +howSection
      +fromSection
      +scoreSection
      // 自分のリーチ棒注記（scores タブで供託を入力済みの場合は参考表示）
      +(state.riichiDiscIdx!==null
        ?'<div style="margin-top:8px;font-size:11px;color:var(--tx3);background:var(--sf2);border-radius:var(--ra);padding:6px 10px;">'
          +'💡 自分のリーチ棒（1000点）は点数計算に自動加算されます。<br>'
          +'場の供託は「局情報 → 点数・供託」タブで入力してください。</div>'
        :'')
      +confirmBtn
      +'</div>';
  }

  // 確定済みならサマリーを先頭に追加
  if(s==='agari' && confirmedSections['agari']){
    var _ag=state.agari;
    var _agLabel=(_ag.who||'未入力')
      +(_ag.who==='流局'?'':(_ag.type?' '+_ag.type:''))
      +(_ag.score?' +'+_ag.score+'点':'')
      +(_ag.yaku?' ('+_ag.yaku+')':'');
    var _agSummary='<div style="background:var(--g-bg);border:.5px solid var(--g);border-radius:var(--ra);'
      +'padding:8px 12px;margin-bottom:8px">'
      +'<div style="font-size:11px;font-weight:700;color:var(--g);margin-bottom:4px">✅ 確定済み</div>'
      +'<div style="font-size:12px;color:var(--tx2)">'+_agLabel+'</div></div>';
    h=_agSummary+h;
  }
  el.innerHTML=h;
  // doraセクションならdora-slot-inputにハンドラ設定
  if(s==="dora"){
    var dsi=document.getElementById('dora-slot-input');
    if(dsi){
      var _ds=state.doraSlot||{row:'dora',idx:0};
      attachDoraHandlers(dsi,_ds.row,_ds.idx);
      dsi.value=''; dsi.focus();
    }
  }
  // turnsセクションならinputにハンドラを設定
  if(s==="turns"&&state.activeSlot){
    var ni=document.getElementById('main-slot-input');
    if(ni){
      attachSlotHandlers(ni,state.activeSlot.grid,state.activeSlot.idx);
      ni.value='';
      ni.focus();
    }
  }
}

// ═══════════════════════════════════════════════
// ╔══════════════════════════════════════════════════════════╗
// ║  § 14. 確定・送信                                        ║
// ║  confirmSection(): セクションを確定してロック              ║
// ║  submitAll(): 全セクション確定後に牌譜を送信               ║
// ╚══════════════════════════════════════════════════════════╝
// 確定・送信
// ═══════════════════════════════════════════════
var confirmedSections={};  // {haipai:true, turns:true, ...}

function confirmSection(key){
  // テキスト入力欄に値が残っていたら自動確定（Enterを押し忘れた場合の救済）
  var kbdInputId = 'kbd-inp-' + (
    key==='haipai' ? 'haipaiPick' :
    key==='final'  ? 'finalPick'  : null
  );
  if(kbdInputId){
    var kbdInp = document.getElementById(kbdInputId);
    if(kbdInp && kbdInp.value.trim()){
      kbdInpConfirm(
        key==='haipai' ? 'haipaiPick' : 'finalPick',
        kbdInputId
      );
    }
  }
  confirmedSections[key]=true;
  // 確定時点のデータをスナップショット保存（タブを切り替えても残る）
  if(key==='scores')  confirmedSections._kyokuStartPts=Object.assign({},state.kyokuStartPts),
                      confirmedSections._kyokuCarryover=state.kyokuCarryover||0;
  if(key==='haipai')  confirmedSections._haipai  = state.haipai.slice();
  if(key==='turns')   confirmedSections._draws    = state.draws.slice(),
                      confirmedSections._discards = state.discards.slice(),
                      confirmedSections._riichiIdx= state.riichiDiscIdx;
  if(key==='final')   confirmedSections._finalHand= state.finalHand.slice(),
                      confirmedSections._melds    = JSON.parse(JSON.stringify(state.melds)),
                      confirmedSections._waitTiles= state.waitTiles.slice();
  if(key==='agari')   confirmedSections._agari    = Object.assign({},state.agari);
  if(key==='dora')    confirmedSections._dora     = state.dora.slice(),
                      confirmedSections._uraDora  = state.uraDora.slice();
  // rtViewTab を確定したセクションに合わせる
  var rtTabMap={haipai:'haipai',turns:'turns',final:'final',meld:'final',agari:'agari'};
  if(rtTabMap[key]) state.rtViewTab=rtTabMap[key];
  // 入力状況パネルを更新
  renderRtPanel();

  // ── 次のタブへ自動移動 ──
  var order=["scores","dora","agari","haipai","turns","final"];
  var ni=order.indexOf(key)+1;

  if(ni<order.length){
    // 同じ席内で次のセクションへ
    setSection(order[ni]);
  } else if(key==='final'){
    // final（最終・副露・待ち）確定 → 次の席の haipai へ
    var seatOrder=['east','south','west','north'];
    var curIdx=seatOrder.indexOf(state.seat||'east');
    var nextIdx=(curIdx+1) % seatOrder.length;  // 北家の次は東家（ループ）
    var nextSeat=seatOrder[nextIdx];
      var WJseats=['東家','南家','西家','北家'];
      // 次の席に切り替えて配牌から入力
      setSeat(nextSeat);          // state保存 + 次席データ展開
      setSection('haipai');       // 配牌タブへ
      // 切り替え通知を一瞬表示
      var banner=document.getElementById('seat-advance-banner');
      if(!banner){
        banner=document.createElement('div');
        banner.id='seat-advance-banner';
        banner.style.cssText='position:fixed;top:60px;left:50%;transform:translateX(-50%);'
          +'background:var(--b);color:#fff;padding:8px 18px;border-radius:20px;'
          +'font-size:13px;font-weight:700;z-index:4000;pointer-events:none;'
          +'box-shadow:0 3px 12px rgba(0,0,0,.3);white-space:nowrap;';
        document.body.appendChild(banner);
      }
      banner.textContent=WJseats[nextIdx]+'の配牌を入力してください';
      banner.style.opacity='1';
      clearTimeout(banner._t);
      banner._t=setTimeout(function(){
        banner.style.transition='opacity .5s';
        banner.style.opacity='0';
      }, 2000);
    // 最後の席（北家）の final 後は何もしない → 送信ボタンから
  }

  // agari (最後) は confirmSummary を出さない → ナビの「送信」ボタンから
  renderNav();
}

function showConfirmSummary(){
  var modal=document.getElementById('confirm-modal');
  if(!modal){ submitAll(); return; }
  modal.style.display='flex';
  renderConfirmSummary();
}
function renderConfirmSummary(){
  var el=document.getElementById('confirm-modal-body');
  if(!el)return;
  var WE=['east','south','west','north'];
  var WJ=['東家','南家','西家','北家'];
  var allP=Object.values(PLAYERS_MASTER).flat();
  var sm=state.seatMap||{};

  // ─ 入力対象の状況 ─
  var myItems=[
    {label:'配牌',     done:state.haipai.length>=13 || !!(confirmedSections._haipai&&confirmedSections._haipai.length),
      val:(function(){
        var t=confirmedSections._haipai&&confirmedSections._haipai.length?confirmedSections._haipai:state.haipai;
        return t.length+'枚 '+handPreview(t);
      })()},
    {label:'ツモ・捨て',done:state.draws.some(Boolean)||state.discards.some(Boolean),
      val:'ツモ '+state.draws.filter(Boolean).length+'巡 / 捨て '+state.discards.filter(Boolean).length+'巡'},
    {label:'最終手牌', done:state.finalHand.length>0,
      val:handPreview(state.finalHand)},
    {label:'待ち牌',   done:state.isTenpai===true&&state.waitTiles.filter(Boolean).length>0,
      val:(state.isTenpai===false?'ノーテン':
           state.waitTiles.filter(Boolean).length
             ?state.waitTiles.filter(Boolean).map(teHtml).join(' ')
             :'（未入力）')},
    {label:'アガリ',   done:!!(state.agari.who),
      val:state.agari.who
        +(state.agari.who==='流局'?'':(state.agari.type?' '+state.agari.type:''))
        +(state.agari.score?' '+state.agari.score+'点':'')
        +(state.agari.yaku?' ('+state.agari.yaku+')':'')},
  ];

  // 自分の座席名
  var mySeatIdx=WE.indexOf(state.seat||'');
  var mySeatLabel=mySeatIdx>=0?WJ[mySeatIdx]:'—';
  var myPid=sm[state.seat||''];
  var myP=myPid?allP.find(function(x){return x.id===myPid;}):null;

  var myHtml='<div style="background:var(--sf2);border-radius:var(--ra);padding:12px;margin-bottom:14px">'
    +'<div style="font-size:12px;font-weight:700;color:var(--b);margin-bottom:10px">'
    +'✏️ 入力対象（'+mySeatLabel+(myP?' '+myP.name:'')+'）</div>';
  myItems.forEach(function(item){
    myHtml+='<div style="border-bottom:.5px solid var(--bd);padding:6px 0;margin-bottom:2px">'
      +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">'
      +'<span style="color:'+(item.done?'var(--g)':'var(--tx3)')+';font-size:14px">'+(item.done?'✓':'○')+'</span>'
      +'<span style="font-size:12px;font-weight:600;color:'+(item.done?'var(--tx)':'var(--tx3)')+'">'+item.label+'</span>'
      +'</div>'
      +(item.done?'<div style="font-size:13px;color:var(--tx);padding-left:20px;line-height:1.5">'+item.val+'</div>':'')
      +'</div>';
  });
  // ドラ情報も表示
  var kanDoraL=state.melds.filter(function(m){return m.kanDoraTile;}).map(function(m){return m.kanDoraTile;});
  var allDora=state.dora.concat(kanDoraL);
  if(allDora.length||state.uraDora.length){
    myHtml+='<div style="padding:6px 0;margin-bottom:2px">'
      +'<div style="font-size:12px;font-weight:600;margin-bottom:4px">🌟 ドラ</div>'
      +(allDora.length?'<div style="font-size:12px;padding-left:20px">表ドラ表示牌: '+allDora.map(teHtml).join(' ')+'</div>':'')
      +(state.uraDora.length?'<div style="font-size:12px;padding-left:20px">裏ドラ表示牌: '+state.uraDora.map(teHtml).join(' ')+'</div>':'')
      +'</div>';
  }
  myHtml+='</div>';

  // ─ 他者の確定済みデータ（rtLog から） ─
  var othersHtml='<div style="font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:8px">👥 他のアカウントの状況</div>';
  var rtLog=state.rtLog||[];
  var seenSeats={};
  rtLog.forEach(function(e){ seenSeats[e.seat]=seenSeats[e.seat]||[]; seenSeats[e.seat].push(e); });

  var otherSeats=WJ.filter(function(sj){ return sj!==mySeatLabel; });
  otherSeats.forEach(function(sj){
    var entries=seenSeats[sj]||[];
    var drawCount=entries.filter(function(e){return e.type==='draw';}).length;
    var discCount=entries.filter(function(e){return e.type==='discard';}).length;
    var haipaiEntries=entries.filter(function(e){return e.type==='haipai';});
    var agariEntry=entries.filter(function(e){return e.type==='agari';}).pop();
    var hasData=entries.length>0;
    // 座席から選手名
    var seatW=WE[WJ.indexOf(sj)];
    var pid=sm[seatW];
    var p=pid?allP.find(function(x){return x.id===pid;}):null;
    othersHtml+='<div style="border:.5px solid var(--bd);border-radius:var(--ra);padding:10px 12px;margin-bottom:8px">'
      +'<div style="font-size:12px;font-weight:600;margin-bottom:6px">'
        +sj+(p?' '+p.name:'')
        +(hasData?'<span style="font-size:10px;background:var(--b-bg);color:var(--b);border-radius:4px;padding:1px 6px;margin-left:6px">入力あり</span>'
          :'<span style="font-size:10px;background:var(--sf2);color:var(--tx3);border-radius:4px;padding:1px 6px;margin-left:6px">未入力</span>')
      +'</div>';
    if(hasData){
      if(haipaiEntries.length) othersHtml+='<div style="font-size:11px;color:var(--tx3)">配牌: 入力済み</div>';
      if(drawCount||discCount) othersHtml+='<div style="font-size:11px;color:var(--tx3)">ツモ '+drawCount+'巡 / 捨て '+discCount+'巡</div>';
      if(agariEntry) othersHtml+='<div style="font-size:11px;color:var(--g)">アガリ: '+(agariEntry.data||'入力済み')+'</div>';
    }
    othersHtml+='</div>';
  });

  // 点数レポート（scoreLog の縦並び表示）
  var scoreLog=state.gameFlow.scoreLog||[];
  var scoreHtml='';
  if(scoreLog.length){
    var WE=['east','south','west','north'];
    var WJr=['東家','南家','西家','北家'];
    var rules=getRules();
    var rule=rules.find(function(r){return r.id===state.gameFlow.rule;})||(rules[0]||{startPts:30000});
    var allP=Object.values(PLAYERS_MASTER).flat();
    var sm=state.seatMap||{};

    scoreHtml='<div style="margin-top:14px;padding-top:12px;border-top:.5px solid var(--bd)">'
      +'<div style="font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:8px">📊 半荘点数レポート</div>';

    // ヘッダー行（プレイヤー名）
    var headers=['局'].concat(WE.map(function(w){
      var pid=sm[w];
      var p=pid?allP.find(function(x){return x.id===pid;}):null;
      return p?p.name:WJr[WE.indexOf(w)];
    }));
    scoreHtml+='<div style="display:grid;grid-template-columns:60px repeat(4,1fr);gap:2px;margin-bottom:4px">';
    headers.forEach(function(h,i){
      scoreHtml+='<div style="font-size:9px;font-weight:600;color:var(--tx3);text-align:'+(i===0?'left':'right')+';padding:2px 4px">'+h+'</div>';
    });
    scoreHtml+='</div>';

    // 初期点数行
    scoreHtml+='<div style="display:grid;grid-template-columns:60px repeat(4,1fr);gap:2px;margin-bottom:6px;background:var(--sf2);border-radius:4px;padding:2px 0">';
    scoreHtml+='<div style="font-size:10px;color:var(--tx3);padding:2px 4px">開始</div>';
    WE.forEach(function(w){
      scoreHtml+='<div style="font-size:11px;font-family:monospace;text-align:right;padding:2px 4px;color:var(--tx2)">'+rule.startPts.toLocaleString()+'</div>';
    });
    scoreHtml+='</div>';

    // 各局の行（開始点数 → 終了点数）
    var runningPts={east:rule.startPts,south:rule.startPts,west:rule.startPts,north:rule.startPts};
    scoreLog.forEach(function(entry){
      var ky=entry.kyoku||{ba:'東',kyoku:1,honba:0};
      var kyLabel=ky.ba+ky.kyoku+'局'+(ky.honba>0?' '+ky.honba+'本':'');

      // 開始点数行
      scoreHtml+='<div style="display:grid;grid-template-columns:60px repeat(4,1fr);gap:2px;border-bottom:.5px solid var(--bd2);padding:2px 0">';
      scoreHtml+='<div style="font-size:10px;font-weight:600;color:var(--tx);padding:2px 4px;align-self:center">'+kyLabel+'</div>';
      WE.forEach(function(w){
        var pts=runningPts[w];
        scoreHtml+='<div style="text-align:right;padding:0 4px">'
          +'<div style="font-size:9px;color:var(--tx3)">'+pts.toLocaleString()+'</div>';

        // 変動
        var d=entry.delta?entry.delta[w]||0:0;
        var end=pts+d;
        runningPts[w]=end;
        var dColor=d>0?'var(--g)':d<0?'var(--r)':'var(--tx3)';
        scoreHtml+='<div style="font-size:10px;color:'+dColor+';font-weight:600">'
          +(d>0?'+':d<0?'':'')+d.toLocaleString()+'</div>'
          +'<div style="font-size:11px;font-family:monospace;font-weight:700;color:var(--tx)">'+end.toLocaleString()+'</div>'
          +'</div>';
      });
      scoreHtml+='</div>';
    });

    // 最終点数行
    scoreHtml+='<div style="display:grid;grid-template-columns:60px repeat(4,1fr);gap:2px;margin-top:4px;background:rgba(74,143,212,.08);border-radius:4px;padding:2px 0">';
    scoreHtml+='<div style="font-size:10px;font-weight:700;color:var(--b);padding:2px 4px">合計</div>';
    WE.forEach(function(w){
      var pts=runningPts[w];
      var color=pts>=rule.startPts?'var(--g)':'var(--r)';
      scoreHtml+='<div style="font-size:13px;font-family:monospace;font-weight:700;text-align:right;padding:2px 4px;color:'+color+'">'+pts.toLocaleString()+'</div>';
    });
    scoreHtml+='</div>';
    scoreHtml+='</div>';
  }

  el.innerHTML=myHtml+othersHtml+scoreHtml;
}

// ═══════════════════════════════════════════════
// 送信
// ═══════════════════════════════════════════════
// ═══════════════════════════════════════════════
// ╔══════════════════════════════════════════════════════════╗
// ║  § 15. 対局情報フロー（ステップ入力）                    ║
// ║  Step1: 日付/団体/大会選択                                ║
// ║  Step2: 選手選択（4席）                                   ║
// ║  Step3: 局選択（東1〜北4、本場）                         ║
// ║  Step4: マッチング確認 → state.gameFlow.matched=true      ║
// ╚══════════════════════════════════════════════════════════╝
// 対局情報フロー（4ステップ）
// ═══════════════════════════════════════════════
function renderGameFlow(){
  try { return _renderGameFlowInner(); }
  catch(e){
    console.error('renderGameFlow error:', e);
    return '<div style="background:#ffebeb;border:2px solid red;border-radius:8px;padding:14px;margin:8px 0">'
      +'<b>エラー詳細:</b><br><code style="font-size:11px;word-break:break-all">'+e.message+'<br>'+e.stack+'</code></div>';
  }
}
function _renderGameFlowInner(){
  var gf=state.gameFlow;
  var step=gf.step;

  // ── ステップインジケーター ──
  var stepLabels=["対局日","団体","大会","選手","確認"];
  var dots=stepLabels.map(function(l,i){
    var done=i<step||(i===step&&step===4);
    var active=i===step&&step<4;
    var dot=done
      ?`<div style="width:22px;height:22px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700">✓</div>`
      :active
      ?`<div style="width:22px;height:22px;border-radius:50%;background:var(--b);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700">${i+1}</div>`
      :`<div style="width:22px;height:22px;border-radius:50%;background:var(--bd2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--tx3)">${i+1}</div>`;
    return`<div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1">
      ${dot}
      <div style="font-size:9px;color:${active?"var(--b)":done?"var(--g)":"var(--tx3)"};white-space:nowrap;font-weight:${active?"700":"400"}">${l}</div>
    </div>`;
  }).join(`<div style="flex:1;height:1px;background:var(--bd);margin-bottom:14px;align-self:center;margin-top:-14px"></div>`);

  var indicator=`<div style="display:flex;align-items:flex-start;margin-bottom:18px">${dots}</div>`;

  // ── 戻るボタン ──
  var backBtn=step>0&&step<4
    ?`<button class="ghost sml" style="margin-bottom:12px" onclick="gfBack()">← 戻る</button><br>`
    :"";

  var body="";

  // ── STEP 0: 対局日 ──
  if(step===0){
    var today=new Date().toISOString().slice(0,10);
    // ドラフト件数を取得
    var _dc=0;
    try{if(localStorage.getItem('tsumolog_draft'))_dc++;}catch(e){}
    try{_dc+=JSON.parse(localStorage.getItem('tsumolog_kifu_history')||'[]').length;}catch(e){}
    body='<div>'
      +'<div class="slabel">対局日を選択</div>'
      +'<input type="date" id="gf-date" value="'+(gf.date||today)+'"'
        +' style="background:var(--sf);border:.5px solid var(--bd2);border-radius:var(--ra);padding:10px 12px;font-size:16px;color:var(--tx);width:100%;outline:none;font-family:inherit;margin-bottom:10px"'
        +' oninput="state.gameFlow.date=this.value">'
      +'<button class="pri" style="width:100%;padding:11px;margin-bottom:10px" onclick="gfNext()">次へ：団体を選ぶ →</button>'
      +'</div>';
    // 今日の日付をデフォルト
    if(!gf.date) state.gameFlow.date=today;
  }

  // ── STEP 1: 団体選択 ──
  else if(step===1){
    var orgBtns=ORGS.map(function(o){
      var on=gf.org===o.id;
      return '<button onclick="gfSelectOrg(\''+o.id+'\')"'
        +' style="padding:14px 10px;border-radius:var(--ra);font-size:15px;font-family:inherit;'
        +'background:'+(on?'var(--b)':'var(--sf)')+';'
        +'border:'+(on?'1.5px solid var(--b)':'.5px solid var(--bd2)')+';'
        +'color:'+(on?'#e6f1fb':'var(--tx)')+';'
        +'cursor:pointer;transition:all .15s;font-weight:'+(on?'700':'400')+'">'
        +o.label+'</button>';
    }).join('');
    body='<div>'
      +'<div class="slabel">団体を選択</div>'
      +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">'+orgBtns+'</div>'
      +(gf.org?'<button class="pri" style="width:100%;padding:11px" onclick="gfNext()">次へ：大会を選ぶ →</button>':'')
      +'</div>';
  }

  // ── STEP 2: 大会選択 ──
  else if(step===2){
    var org=ORGS.find(function(o){return o.id===gf.org;});
    var tours=TOURNAMENTS[gf.org]||[];
    var tourBtns=tours.map(function(t){
      var on=gf.tournament===t.id;
      var tRule=t.rule_id?getRules().find(function(r){return r.id===t.rule_id;}):null;
      return '<button onclick="gfSelectTournament(\''+t.id+'\')"'
        +' style="padding:12px 14px;border-radius:var(--ra);font-size:14px;font-family:inherit;text-align:left;'
        +'background:'+(on?'var(--b-bg)':'var(--sf)')+';'
        +'border:'+(on?'1.5px solid var(--b)':'.5px solid var(--bd2)')+';'
        +'color:'+(on?'var(--b-t)':'var(--tx)')+';'
        +'cursor:pointer;display:flex;align-items:center;gap:8px;width:100%">'
        +'<span style="font-size:18px">'+(on?'✅':'⬜')+'</span>'
        +'<div><div style="font-weight:'+(on?'700':'400')+'">'+t.label+'</div>'
        +(tRule?'<div style="font-size:10px;color:var(--tx3)">'+tRule.label+'</div>':'')
        +'</div></button>';
    }).join('');
    var rules=getRules();
    var ruleOpts=rules.map(function(r){
      return'<option value="'+r.id+'"'+(gf.rule===r.id?' selected':'')+'>'+r.label+'</option>';
    }).join('');
    var selRule=rules.find(function(r){return r.id===gf.rule;})||null;
    var ruleInfoHtml=selRule
      ?'<div style="font-size:11px;color:var(--b);margin-top:4px">'
        +'初期点数 '+selRule.startPts.toLocaleString()+'点　'
        +'ウマ '+selRule.uma.map(function(u){return(u>0?'+':'')+u;}).join('・')
        +(selRule.oka?'　オカ +'+selRule.oka.toLocaleString():'')
        +'</div>'
      :'';
    var customForm=(gf.rule==='custom')
      ?'<div style="background:var(--sf2);border-radius:var(--ra);padding:10px 12px;margin-top:8px">'
        +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'
        +['startPts:初期点数','oka:オカ','uma1:1着ウマ','uma2:2着ウマ','uma3:3着ウマ','uma4:4着ウマ'].map(function(itm){
          var pts=itm.split(':'),key=pts[0],lbl=pts[1];
          var val=(gf.customRule&&gf.customRule[key]!==undefined)?gf.customRule[key]:'';
          return'<div><div style="font-size:10px;color:var(--tx3);margin-bottom:2px">'+lbl+'</div>'
            +'<input type="number" value="'+val+'" placeholder="0" '
            +'onchange="gfSetCustomRule(\''+key+'\',this.value)" '
            +'style="width:100%;padding:5px 8px;border:.5px solid var(--bd2);border-radius:6px;'
            +'background:var(--sf);color:var(--tx);font-size:13px;font-family:inherit;outline:none">'
            +'</div>';
        }).join('')
        +'</div></div>'
      :'';
    body='<div>'
      +'<div style="font-size:12px;color:var(--tx3);margin-bottom:8px">団体：<strong style="color:var(--tx)">'+(org?org.label:'')+'</strong></div>'
      +'<div class="slabel">大会を選択</div>'
      +'<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">'+tourBtns+'</div>'
      +'<div style="margin-bottom:14px">'
        +'<div class="slabel">ルール</div>'
        +'<select onchange="gfSelectRule(this.value)" '
          +'style="width:100%;padding:9px 10px;background:var(--sf);border:.5px solid var(--bd2);border-radius:var(--ra);color:var(--tx);font-size:14px;font-family:inherit;outline:none;margin-bottom:4px">'
          +'<option value="">（未選択）</option>'
          +ruleOpts
        +'</select>'
        +ruleInfoHtml
        +customForm
      +'</div>'
      +(gf.tournament?'<button class="pri" style="width:100%;padding:11px" onclick="gfNext()">次へ：選手を選ぶ →</button>':'')
      +'</div>';
  }

  // ── STEP 3: 選手選択 ──
  else if(step===3){
    var org3=ORGS.find(function(o){return o.id===gf.org;});
    var tour3=(TOURNAMENTS[gf.org]||[]).find(function(t){return t.id===gf.tournament;});
    var orgTab=gf.playerOrgTab||gf.org;

    // 団体タブ
    var orgTabBtns=ORGS.filter(function(o){return(PLAYERS_MASTER[o.id]||[]).length>0;}).map(function(o){
      var on=orgTab===o.id;
      return'<button class="kbd-tab'+(on?' on':'')+'" onclick="gfSetPlayerTab(\''+o.id+'\')">'+o.label+'</button>';
    }).join('');

    // 選手ボタン
    var playersInTab=PLAYERS_MASTER[orgTab]||[];
    var playerBtns=playersInTab.map(function(p){
      var on=gf.players.indexOf(p.id)>=0;
      return '<button onclick="gfTogglePlayer(\''+p.id+'\')" '
        +'style="padding:10px 12px;border-radius:var(--ra);font-family:inherit;text-align:left;'
        +'background:'+(on?'var(--b-bg)':'var(--sf)')+';'
        +'border:'+(on?'1.5px solid var(--b)':'.5px solid var(--bd2)')+';'
        +'color:'+(on?'var(--b-t)':'var(--tx)')+';'
        +'cursor:pointer;display:flex;align-items:center;gap:10px">'
        +'<span style="font-size:18px;flex-shrink:0">'+(on?'✅':'⬜')+'</span>'
        +'<div>'
          +'<div style="font-size:14px;font-weight:'+(on?'700':'400')+'">'+p.name+'</div>'
          +'<div style="font-size:10px;color:var(--tx3)">'+p.ruby+(p.isPro?' · PRO':'')+'</div>'
        +'</div></button>';
    }).join('');

    // 選択済みチップ
    var selectedChips=gf.players.length
      ?gf.players.map(function(id){
          var p=Object.values(PLAYERS_MASTER).flat().find(function(x){return x.id===id;});
          return p?'<span style="font-size:12px;padding:3px 10px;border-radius:20px;background:var(--b);color:#e6f1fb;display:inline-flex;align-items:center;gap:5px">'
            +p.name
            +'<span style="cursor:pointer;opacity:.7" onclick="gfTogglePlayer(\''+p.id+'\')">✕</span>'
            +'</span>':'';
        }).join('')
      :'<span style="font-size:12px;color:var(--tx3)">まだ選択されていません（最大4名）</span>';

    // body 組み立て
    body='<div>'
      +'<div style="font-size:12px;color:var(--tx3);margin-bottom:6px">'
      +(org3?org3.label:'')+(tour3?' / '+tour3.label:'')
      +'</div>'
      +'<div class="slabel">出場選手を選択 <span style="font-weight:400;color:var(--tx3)">(最大4名)</span></div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;min-height:28px">'+selectedChips+'</div>'
      +'<div class="kbd-tabs" style="margin-bottom:8px">'+orgTabBtns+'</div>'
      +'<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">'+playerBtns+'</div>'
      +(gf.players.length>=2
        ?'<button class="pri" style="width:100%;padding:11px" onclick="gfNext()">次へ：確認 →</button>'
        :'<div style="font-size:12px;color:var(--tx3);text-align:center;padding:6px">2名以上選択してください</div>')
      +'</div>';




  }
  // ── STEP 4: 確認・マッチング ──
  else if(step===4){
    var org4=ORGS.find(function(o){return o.id===gf.org;});
    var tour4=(TOURNAMENTS[gf.org]||[]).find(function(t){return t.id===gf.tournament;});
    var selPlayers=gf.players.map(function(id){
      return Object.values(PLAYERS_MASTER).flat().find(function(x){return x.id===id;});
    }).filter(Boolean);

    var matchKey=makeMatchKey(gf, state.seatMap||{});
    var alreadyMatched=gf.matched&&gf.matchKey===matchKey;

    body=`<div>
      <div class="slabel">入力内容を確認</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
        <div style="background:var(--sf2);border-radius:var(--ra);padding:10px 14px">
          <div style="font-size:10px;color:var(--tx3);margin-bottom:2px">対局日</div>
          <div style="font-size:15px;font-weight:600">${gf.date}</div>
        </div>
        <div style="background:var(--sf2);border-radius:var(--ra);padding:10px 14px">
          <div style="font-size:10px;color:var(--tx3);margin-bottom:2px">団体 / 大会</div>
          <div style="font-size:15px;font-weight:600">${org4?org4.label:""} / ${tour4?tour4.label:""}</div>
        </div>
        <div style="background:var(--sf2);border-radius:var(--ra);padding:10px 14px">
          <div style="font-size:10px;color:var(--tx3);margin-bottom:3px">出場選手（${selPlayers.length}名）</div>
          <div style="display:flex;flex-wrap:wrap;gap:5px">
            ${selPlayers.map(function(p){
              return`<span style="font-size:13px;padding:3px 10px;border-radius:20px;background:var(--b-bg);color:var(--b-t)">${p.name}</span>`;
            }).join("")}
          </div>
          <div style="font-size:11px;color:var(--tx3);margin-top:6px">💡 初期配置はマッチング後に「点数・供託」タブで設定できます</div>
        </div>
      </div>

      ${alreadyMatched
        ?`<div style="background:var(--g-bg);border:.5px solid var(--g);border-radius:var(--ra);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px">
            <span style="font-size:22px">✅</span>
            <div>
              <div style="font-size:13px;font-weight:700;color:var(--g)">マッチング完了</div>
              <div style="font-size:12px;color:var(--g)">入力画面に移行します…</div>
            </div>
          </div>`
        :`<div style="background:var(--b-bg);border:.5px solid var(--b);border-radius:var(--ra);padding:12px 14px;margin-bottom:12px;font-size:12px;color:var(--b-t)">
            ⚡ 同じ日付・団体・大会・選手を入力した他のユーザーとマッチングします。<br>
            一致した場合、入力データは自動的に統合されます。
          </div>
          <button class="gold" style="width:100%;padding:12px;font-size:15px;border-radius:var(--ra);border:none;cursor:pointer;font-family:inherit;font-weight:700" onclick="gfDoMatch()">🔍 マッチングして入力を開始する</button>`
      }
      <button class="ghost" style="width:100%;padding:8px;margin-top:8px" onclick="gfBack()">← 修正する</button>
    </div>`;
  }

  // ドラフト一覧ボタン（常に「対局情報」の直下に表示）
  var _dc2=0;
  try{if(localStorage.getItem('tsumolog_draft'))_dc2++;}catch(e){}
  try{_dc2+=JSON.parse(localStorage.getItem('tsumolog_kifu_history')||'[]').length;}catch(e){}
  var draftListBtn='<button onclick="location.href=\'paifu-shop.html?tab=kifu\'" '
    +'style="width:100%;padding:11px 14px;margin-bottom:10px;border-radius:var(--ra);'
    +'background:linear-gradient(135deg,var(--b-bg),rgba(74,143,212,.12));'
    +'border:1.5px solid var(--b);color:var(--b);'
    +'font-size:13px;font-family:inherit;cursor:pointer;'
    +'display:flex;align-items:center;gap:10px;box-sizing:border-box;'
    +'box-shadow:0 2px 8px rgba(74,143,212,.15)">'
    +'<span style="font-size:18px">📋</span>'
    +'<div style="flex:1;text-align:left">'
    +'<div style="font-weight:700">編集途中・完成牌譜一覧</div>'
    +'<div style="font-size:11px;color:var(--b);opacity:.75">'+_dc2+'件 / 絞り込み検索</div></div>'
    +'<span style="font-size:16px;color:var(--b)">›</span>'
    +'</button>';

function gfInitSelPlayer(pid){

function gfInitDropToSeat(w){
  var pid=state.gameFlow.initSelPid; if(!pid)return;
  gfSetInitSeat(w, pid);
}
function gfSetInitSeat(w, pid){
  if(!state.gameFlow.initSeats) state.gameFlow.initSeats={};
  // 既存の配置を解除（同じpidを別の座席に割り当て直す）
  if(pid) WE.forEach(function(ow){if(ow!==w&&state.gameFlow.initSeats[ow]===pid)state.gameFlow.initSeats[ow]=null;});
  state.gameFlow.initSeats[w] = pid||null;
  state.gameFlow.initSelPid = null;
  // 配置完了したら現在の局の座席を自動計算
  if(gfInitSeatsComplete()){
    var sel=state.gameFlow.selectedKyoku||{ba:'東',kyoku:1,honba:0};
    gfSelectKyoku(sel.ba, sel.kyoku, sel.honba);
    return; // gfSelectKyokuがrenderSectionを呼ぶ
  }
  renderSection();
}
function gfInitSeatsComplete(){
  var gf=state.gameFlow;
  if(!gf.initSeats) return false;
  var WE=['east','south','west','north'];
  var assigned=WE.filter(function(w){return gf.initSeats[w];});
  var unique=[];
  assigned.forEach(function(w){if(unique.indexOf(gf.initSeats[w])<0)unique.push(gf.initSeats[w]);});
  // 選手数分の座席が割り当てられ、重複なし
  return assigned.length===gf.players.length && unique.length===assigned.length;
}

// 局一覧を生成（東1〜南4 + 本場）
function renderKyokuList(gf){
  var WE=['east','south','west','north'];
  var allP=Object.values(PLAYERS_MASTER).flat();
  var initSeats=gf.initSeats||{};
  var n=(gf.players||[]).length||4;
  // honbaHistory: {ba+'_'+kyoku: 最大本場数} を記録
  var hh=gf.honbaHistory||{};

  // 本場の最大値を取得（履歴 or デフォルト0）
  function maxHonba(ba,k){ return hh[ba+'_'+k]||0; }

  // 現在の本場数（ユーザーが ▲▼ で調整中）
  var curHonba=gf.currentHonba||{};  // {ba+'_'+k: 表示中の本場数}
  function dispHonba(ba,k){ return curHonba[ba+'_'+k]||0; }

  var rounds=['東','南'];
  var sel=gf.selectedKyoku||{ba:'東',kyoku:1,honba:0};

  // 親の計算
  function getOya(ba,k){
    var idx=(ba==='東'?0:n)+k-1;
    var w=WE[idx%n];
    var pid=initSeats[w];
    return pid?allP.find(function(x){return x.id===pid;}):null;
  }

  // 現在の各プレイヤー点数（scoreLog から計算）
  var scoreLog=gf.scoreLog||[];
  var rules=getRules();
  var rule=rules.find(function(r){return r.id===gf.rule;})||(rules[0]||{startPts:30000});
  var currentPts={east:rule.startPts,south:rule.startPts,west:rule.startPts,north:rule.startPts};
  scoreLog.forEach(function(entry){
    WE.forEach(function(w){
      if(entry.delta&&entry.delta[w]!==undefined) currentPts[w]+=entry.delta[w];
    });
  });

  var html='<div style="margin-bottom:8px">'
    +'<div style="font-size:11px;color:var(--tx3);margin-bottom:8px">入力する局を選択してください</div>';

  rounds.forEach(function(ba){
    html+='<div style="font-size:11px;font-weight:600;color:var(--tx2);margin-bottom:4px">'+ba+'場</div>';
    html+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">';
    for(var k=1;k<=n;k++){
      var h=dispHonba(ba,k);
      var maxH=Math.max(maxHonba(ba,k),h);
      var isSel=sel.ba===ba&&sel.kyoku===k&&sel.honba===h;
      var oya=getOya(ba,k);
      var kyLabel=ba+k+'局'+(h>0?' '+h+'本場':'');

      html+=''
        // 外枠: 局ボタン + ▲▼
        +'<div style="display:flex;align-items:stretch;border-radius:8px;overflow:hidden;'
          +'border:'+(isSel?'1.5px solid var(--b)':'.5px solid var(--bd2)')+'">'
        // 局ボタン本体
        +'<button onclick="gfSelectKyoku(\''+ba+'\','+k+','+h+')" '
          +'style="padding:8px 12px;font-size:13px;font-family:inherit;cursor:pointer;border:none;'
          +'background:'+(isSel?'var(--b)':'var(--sf)')+';'
          +'color:'+(isSel?'#e6f1fb':'var(--tx)')+';text-align:left;line-height:1.4">'
          +'<div style="font-weight:600">'+kyLabel+'</div>'
          +(oya?'<div style="font-size:9px;opacity:.75">親:'+oya.name+'</div>':'')
        +'</button>'
        // ▲▼ ボタン群
        +'<div style="display:flex;flex-direction:column;background:'+(isSel?'rgba(255,255,255,.15)':'var(--sf2)')+';border-left:.5px solid var(--bd2)">'
          +'<button onclick="gfChangeHonba(\''+ba+'\','+k+',1)" '
            +'style="flex:1;padding:2px 7px;border:none;background:transparent;cursor:pointer;'
            +'font-size:11px;color:var(--tx3);line-height:1" title="本場+1">▲</button>'
          +'<button onclick="gfChangeHonba(\''+ba+'\','+k+',-1)" '
            +'style="flex:1;padding:2px 7px;border:none;background:transparent;cursor:pointer;'
            +'font-size:11px;color:var(--tx3);line-height:1;'
            +(h===0?'opacity:.3;pointer-events:none':'')
            +'" title="本場-1">▼</button>'
        +'</div>'
        +'</div>';
    }
    html+='</div>';
  });

  html+='</div>';

  // 現在の点数スコアボード
  html+='<div style="margin-top:12px;border:.5px solid var(--bd);border-radius:var(--ra);overflow:hidden">'
    +'<div style="background:var(--sf2);padding:6px 10px;font-size:10px;font-weight:600;color:var(--tx3)">現在の点数'
    +(state.gameFlow.matched?' <span style="font-weight:400;color:var(--tx3)">— 点数・供託タブで入力対象プレイヤーを切り替えられます</span>':'')
    +'</div>';
  var dispSeats=['east','south','west','north'];
  var WJd=['東家','南家','西家','北家'];
  var MAX_PTS=rule.startPts*4;
  dispSeats.forEach(function(w,wi){
    var pid=initSeats[w];
    var p=pid?allP.find(function(x){return x.id===pid;}):null;
    var pts=currentPts[w];
    var color=pts>=rule.startPts?'var(--g)':'var(--r)';
    var isMySeat=state.seat===w;
    var rowBg=isMySeat?';background:var(--g-bg)':'';
    var nameCo=isMySeat?'var(--g)':'var(--tx)';
    html+='<div style="padding:6px 10px;border-bottom:.5px solid var(--bd2);display:flex;align-items:center;gap:6px'+rowBg+'">'+
      '<div style="font-size:11px;color:var(--tx3);min-width:28px">'+WJd[wi]+'</div>'+
      '<div style="font-size:12px;font-weight:600;flex:1;color:'+nameCo+'">'+(p?p.name:'—')+(isMySeat?' ◀ 入力対象':'')+'</div>'+
      '<div style="font-family:monospace;font-size:13px;font-weight:700;color:'+color+';min-width:52px;text-align:right">'+pts.toLocaleString()+'</div>'+
      '</div>';
  });
  html+='</div>';

  return html;
}

// ▲▼ で本場を変更
function gfChangeHonba(ba, k, delta){
  if(!state.gameFlow.currentHonba) state.gameFlow.currentHonba={};
  var key=ba+'_'+k;
  var cur=state.gameFlow.currentHonba[key]||0;
  var next=Math.max(0, cur+delta);
  state.gameFlow.currentHonba[key]=next;
  // 選択中の局が同じなら honba も更新
  var sel=state.gameFlow.selectedKyoku;
  if(sel&&sel.ba===ba&&sel.kyoku===k){
    state.gameFlow.selectedKyoku={ba:ba,kyoku:k,honba:next};
    gfSelectKyoku(ba,k,next);
    return;
  }
  renderSection();
}

function gfSelectKyoku(ba, kyoku, honba){
  state.gameFlow.selectedKyoku={ba:ba,kyoku:kyoku,honba:honba};
  // 供託リーチ棒を自動セット
  state.riichiSticks=state.gameFlow.riichiCarryover||0;
  // 初期配置が完了している場合のみ座席を自動計算
  var gf=state.gameFlow;
  var initSeats=gf.initSeats||{};
  var players=gf.players||[];
  var n=players.length;
  if(gfInitSeatsComplete()){
    var kyokuIdx=(ba==='東'?0:n)+kyoku-1;
    var newSeats={};
    WE.forEach(function(w,wi){
      var pid=initSeats[w];
      if(pid){
        var newWi=(wi - kyokuIdx % n + n*10) % n;
        newSeats[WE[newWi]] = pid;
      }
    });
    state.gameFlow.computedSeats=newSeats;
    // 入力対象プレイヤーの座席を局ごとに自動追従
    if(state.seat){
      var myPid=initSeats[state.seat]||null;
      if(myPid){
        var myNewSeat=Object.keys(newSeats).find(function(w){return newSeats[w]===myPid;});
        if(myNewSeat) state.seat=myNewSeat;
      }
    }
    state.seatMap=Object.assign({east:null,south:null,west:null,north:null},newSeats);
  }
  renderSection();
}

// gfSetMySeat: 入力対象プレイヤーの座席を変更する

function gfStartInput(){

    gfShowSeatPicker(function(wind){

      _gfStartInputCore();
    });

  }
  _gfStartInputCore();
}
function _gfStartInputCore(){
  // 選択済み局と座席を state に反映
  var gf=state.gameFlow;
  var ky=gf.selectedKyoku||{ba:'東',kyoku:1,honba:0};
  var seats=gf.computedSeats||gf.initSeats||{};
  state.seatMap=Object.assign({east:null,south:null,west:null,north:null}, seats);
  state.gameInfo=state.gameInfo||{};
  state.gameInfo.bakaze=ky.ba;
  state.gameInfo.kyoku=ky.kyoku;
  state.gameInfo.honba=ky.honba;
  // ポイント付与
  var existDraft=localStorage.getItem('tsumolog_draft');
  var isResume=false;
  try{if(existDraft){var ed=JSON.parse(existDraft);isResume=!!(ed.state&&ed.state.gameFlow&&ed.state.gameFlow.matched);}}catch(e){}
  if(!isResume){
    TsumologPoints.grant('new_kifu_start',5,'新規牌譜入力開始').then(function(){TsumologPoints.refreshDisplay();});
  }
  state.section='scores'; // 最初は点数・供託タブ
  state.bigTab='kyoku';   // 局情報（共通）大タブから開始
  document.body.classList.add('is-input'); // 入力モード: 薄い緑背景
  renderNav();
  renderSection();
}

function gfDoMatch(){
  var gf=state.gameFlow;

  var key=makeMatchKey(gf, state.seatMap||{});

  state.gameFlow.matchKey=key;

  var org=ORGS.find(function(o){return o.id===gf.org;});

  state.kbdOpen[fn]=!state.kbdOpen[fn];
  renderSection();
}

  renderSection();
}

function rtPush(entry){
  entry.self=true;
  entry.ts=Date.now();
  state.rtLog.unshift(entry);
  if(state.rtLog.length>60)state.rtLog.pop();
  renderRtPanel();
}

// デモ用: 他ユーザーからの受信シミュレーション
function rtReceive(entry){
  entry.self=false;
  state.rtLog.unshift(entry);
  if(state.rtLog.length>60)state.rtLog.pop();
  renderRtPanel();
  // グリッドも再描画（審議チェックのため）
  if(state.section==="turns") renderSection();
}

// 牌譜完成度（%）計算
function calcCompletion(){
  var score=0,max=0;
  var tasks=[
    {done:!!state.seat,                                         w:1},
    {done:state.haipai.length>=13,                             w:1},
    {done:state.draws.filter(Boolean).length>0,                w:1},
    {done:state.discards.filter(Boolean).length>0,             w:1},
    {done:state.finalHand.length>0,                            w:1},
    {done:state.waitTiles.length>0,                            w:1},
    {done:!!state.agari.type,                                  w:1},
    {done:!!state.agari.score,                                 w:1},
  ];
  tasks.forEach(function(t){max+=t.w;if(t.done)score+=t.w;});
  return Math.round(score/max*100);
}

function renderRtPanel(){
  var tabsEl = document.getElementById("rt-tabs");
  var inner  = document.getElementById("rt-panel-inner");
  if(!inner) return;

  var RT_TABS = [
    {id:"haipai", label:"配牌"},
    {id:"turns",  label:"ツモ・捨て"},
    {id:"final",  label:"最終・待ち・副露"},
    {id:"agari",  label:"アガリ・点数"},
  ];
  if(!state.rtViewTab) state.rtViewTab = "haipai";
  var tab = state.rtViewTab;

  // タブボタン
  if(tabsEl){
    tabsEl.innerHTML = RT_TABS.map(function(t){
      var on = (t.id === tab);
      return '<button onclick="state.rtViewTab=\''+t.id+'\';renderRtPanel()" style="'
        +'flex:1;padding:7px 4px;font-size:11px;border:none;border-bottom:2px solid '
        +(on?'var(--b)':'transparent')+';background:transparent;'
        +'color:'+(on?'var(--b)':'var(--tx3)')+';cursor:pointer;font-weight:'+(on?'700':'400')+'">'
        +t.label+'</button>';
    }).join('');
  }

  var WJseats = ["東家","南家","西家","北家"];
  var sm = state.seatMap||{};
  var allP = Object.values(PLAYERS_MASTER).flat();

  // 他者確定データかどうかの判定（rtLogにselfフラグがある）
  function isSelfEntry(e){ return e.self === true; }

  // 座席ラベル+選手名
  function seatName(seatKey){
    var idx = WE.indexOf(seatKey);
    var label = WJseats[idx]||seatKey;
    var pid = sm[seatKey];
    var p = pid ? allP.find(function(x){return x.id===pid;}) : null;
    return label + (p?' '+p.name:'');
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  var html = '';

  if(tab === 'haipai'){
    // 配牌: 自分の入力 + 他者からのログ
    var seats = WE;
    html = seats.map(function(w){
      var isMe = (w === state.seat);
      var sn = seatName(w);
      // 自分の入力はstateから直接取得
      var tiles = isMe ? state.haipai : [];
      // 他者のログから配牌情報を収集
      if(!isMe){
        state.rtLog.forEach(function(e){
          if(e.seat===WJseats[WE.indexOf(w)]&&e.type==='haipai'&&e.tile){
            tiles = e.tiles||tiles;
          }
        });
      }
      var tileHtml = tiles.length
        ? '<div style="font-size:20px;letter-spacing:1px;line-height:1.3">'+tiles.map(teHtml).join('')+'</div>'
        : '<span style="font-size:11px;color:var(--tx3)">未入力</span>';
      var borderStyle = isMe ? 'border:.5px solid var(--bd)' : 'border:2px solid var(--b)';
      var bgStyle = isMe ? 'background:var(--sf)' : 'background:var(--b-bg)';
      return '<div style="'+borderStyle+';'+bgStyle+';border-radius:var(--ra);padding:8px 10px;margin-bottom:8px">'
        +'<div style="font-size:11px;font-weight:'+(isMe?'400':'700')+';color:'+(isMe?'var(--tx3)':'var(--b)')+';margin-bottom:4px">'
        +sn+(isMe?' (自分)':'')+'</div>'
        +tileHtml
        +'</div>';
    }).join('');
    if(!html) html = '<p style="font-size:12px;color:var(--tx3)">データなし</p>';
  } else if(tab === 'turns'){
    // ツモ・捨て: 全座席のミニグリッド
    var maxShow = Math.max(
      state.draws.filter(Boolean).length,
      state.discards.filter(Boolean).length,
      1
    );
    html = WE.map(function(w){
      var isMe = (w === state.seat);
      var sn = seatName(w);
      // 自分: stateから / 他者: rtLogから
      var draws = isMe ? state.draws : [];
      var discs  = isMe ? state.discards : [];
      if(!isMe){
        state.rtLog.forEach(function(e){
          var seat = WJseats[WE.indexOf(w)];
          if(e.seat===seat){
            if(e.type==='draw')    draws[e.idx]=e.tile;
            if(e.type==='discard') discs[e.idx]=e.tile;
          }
        });
      }
      var anyData = draws.some(Boolean)||discs.some(Boolean);
      var borderStyle = isMe ? 'border:.5px solid var(--bd)' : 'border:2px solid var(--b)';
      var bgStyle = isMe ? 'background:var(--sf)' : 'background:var(--b-bg)';
      var gridHtml = '';
      if(anyData){
        var maxIdx = 0;
        for(var i=0;i<21;i++){if(draws[i]||discs[i])maxIdx=i;}
        var drawRow='', discRow='';
        var myRiichiIdx = isMe ? state.riichiDiscIdx : null;

            +(dt?teHtml(dt):'<span style="font-size:8px;color:var(--tx3)">'+(j+1)+'</span>')+'</span>';
          var isRiichi = (myRiichiIdx !== null && j === myRiichiIdx);
          discRow += '<span style="display:inline-flex;align-items:center;justify-content:center;'
            +'width:24px;height:24px;font-size:16px;border-radius:3px;position:relative;'

            +'border:'+(isRiichi?'1.5px solid #d05050':'.5px solid var(--bd)')+';margin:1px">'
            +(di2?teHtml(di2):'<span style="font-size:8px;color:var(--tx3)">'+(j+1)+'</span>')
            +(isRiichi?'<span style="position:absolute;top:-5px;left:-3px;'

              +'border-radius:3px;padding:0 2px;line-height:14px;pointer-events:none">R</span>':'')
            +'</span>';

        +sn+(isMe?' (自分)':'')+'</div>'
        +gridHtml+'</div>';
    }).join('');
  } else if(tab === 'final'){
    // 最終手牌・待ち・副露
    html = WE.map(function(w){
      var isMe = (w === state.seat);
      var sn = seatName(w);
      var finalTiles = isMe ? state.finalHand : [];
      var waitTiles  = isMe ? state.waitTiles.filter(Boolean) : [];
      var melds      = isMe ? state.melds : [];
      var borderStyle = isMe ? 'border:.5px solid var(--bd)' : 'border:2px solid var(--b)';
      var bgStyle = isMe ? 'background:var(--sf)' : 'background:var(--b-bg)';
      var finalHtml = finalTiles.length
        ? finalTiles.map(teHtml).join('')
        : '<span style="font-size:11px;color:var(--tx3)">未入力</span>';
      var waitHtml = waitTiles.length
        ? waitTiles.map(teHtml).join('')
        : '<span style="font-size:11px;color:var(--tx3)">なし</span>';
      var meldHtml = melds&&melds.length
        ? '<div style="display:flex;flex-wrap:wrap;gap:4px">'+melds.map(function(m){
            var typeLabel={'chi':'チー','pon':'ポン','kan':'カン','ankan':'暗カン'}[m.type]||m.type;
            var tiles=(m.tiles||[]).map(teHtml).join('');
            var extras=(m.rinshanTile?'嶺上:'+teHtml(m.rinshanTile):'')
              +(m.discTile?' 捨:'+teHtml(m.discTile):'')
              +(m.kanDoraTile?' Dら:'+teHtml(m.kanDoraTile):'')
              +(m.kanTsumoTile?' カン前ツモ:'+teHtml(m.kanTsumoTile):'');
            return'<span style="font-size:12px;background:var(--sf2);border-radius:4px;padding:2px 6px">'

    // アガリ・点数

function correctDispute(type,idx,tile){
  if(type==="draw")state.draws[idx]=tile;
  else if(type==="discard")state.discards[idx]=tile;
  state.rtLog=state.rtLog.filter(function(e){
    return!(e.type===type&&e.idx===idx&&e.tile!==tile);
  });
  renderRtPanel();
  if(state.section==="turns")renderSection();
}

// チーの形候補
function chiOptions(nakiTile){
  var mc=nakiTile.match(/^(\d)([mps])$/i);
  if(!mc)return[];
  var n=parseInt(mc[1]),s=mc[2].toLowerCase();
  var opts=[];
  if(n<=7)opts.push({tiles:[n+s,(n+1)+s,(n+2)+s],nakiIdx:0,label:te(n+s)+"を先頭に"});
  if(n>=2&&n<=8)opts.push({tiles:[(n-1)+s,n+s,(n+1)+s],nakiIdx:1,label:te(n+s)+"を中間に"});
  if(n>=3)opts.push({tiles:[(n-2)+s,(n-1)+s,n+s],nakiIdx:2,label:te(n+s)+"を末尾に"});
  return opts;
}
// ポンの方向候補
function ponOptions(tile){
  return[
    {tiles:[tile,tile,tile],nakiIdx:0,from:"上家から"},
    {tiles:[tile,tile,tile],nakiIdx:1,from:"対面から"},
    {tiles:[tile,tile,tile],nakiIdx:2,from:"下家から"},
  ];
}
// カン候補（大明槓+暗カン）
function kanOptions(tile){
  return[
    {tiles:[tile,tile,tile,tile],nakiIdx:0,from:"上家から（大明槓）",attr:"0"},
    {tiles:[tile,tile,tile,tile],nakiIdx:1,from:"対面から（大明槓）",attr:"1"},
    {tiles:[tile,tile,tile,tile],nakiIdx:2,from:"下家から（大明槓）",attr:"2"},
    {tiles:[tile,tile,tile,tile],nakiIdx:-1,from:"暗カン（自分のツモ）",attr:"ankan"},
  ];
}

// 鳴いた牌にバッジをつけて表示
function tilesWithNakiHTML(tiles,nakiIdx){
  // 下家から(nakiIdx=2 かつ 4枚=カン) の場合、鳴バッジは最右端の牌につける
  var effectiveNakiIdx=nakiIdx;
  if(tiles.length===4&&nakiIdx===2){
    effectiveNakiIdx=3; // 一番右
  }
  return tiles.map(function(t,i){
    var e=te(t);
    if(i===effectiveNakiIdx){
      return'<span style="position:relative;display:inline-block">'
        +e
        +'<span style="position:absolute;top:-5px;right:-3px;font-size:8px;font-weight:700;'
        +'background:var(--a);color:#fff;border-radius:3px;padding:0 2px;line-height:1.4">鳴</span>'
        +'</span>';
    }
    return e;
  }).join("");
}

// 捨て牌のうち鳴かれた牌にバッジ
function discWithMeldBadge(discards,melds){
  return discards.map(function(tile,i){
    if(!tile)return'<span style="opacity:.2">·</span>';
    // この捨て牌インデックスがどの副露のdiscTileIndexと一致するか
    var meld=melds.find(function(m){return m.discTileIdx===i;});
    var nakiMeld=melds.find(function(m){
      // 鳴かれた牌 = discards[i]がnakiTileと一致
      return m.nakiTile===tile&&m.nakiFromDiscIdx===i;
    });
    var e=te(tile);
    if(nakiMeld){
      var bc=nakiMeld.type==="pon"?"#a32d2d":nakiMeld.type==="chi"?"#0f6e56":"#ba7517";
      var bl=nakiMeld.type==="pon"?"P↓":nakiMeld.type==="chi"?"C↓":"K↓";
      return'<span style="position:relative;display:inline-block">'
        +e
        +'<span style="position:absolute;top:-5px;right:-3px;font-size:8px;font-weight:700;'
        +'background:'+bc+';color:#fff;border-radius:3px;padding:0 2px;line-height:1.4">'+bl+'</span>'
        +'</span>';
    }
    return e;
  }).join("");
}

// finalタブ内埋め込み用ラッパー（card外側なしで中身のみ返す）
function _renderMeldInline(){
  var full=renderMeldSection();
  // renderMeldSection は '<div class="card">…</div>' を返す
  // 外側の card div を除いた中身だけを返す
  var m=full.match(/^<div class="card">([\s\S]*)<\/div>$/);
  return m?m[1]:full;
}

// 副露セクション描画
function renderMeldSection(){
  var d=state.meldDraft;
  var myDiscards=state.discards.filter(Boolean);
  var step=d?d.step:0; // 0=タイプ選択 1=牌選択 2=形/方向 3=嶺上牌 4=捨て牌 5=カンドラ 6=完了確認

  // 既存副露リスト
  var meldList=state.melds.length
    ?'<div style="margin-bottom:12px">'
      +'<div style="font-size:11px;color:var(--tx3);margin-bottom:6px">入力済み副露</div>'
      +state.melds.map(function(m,i){
        var lbl={pon:"ポン",chi:"チー",kan:"カン",ankan:"暗カン"}[m.isAnkan?"ankan":m.type]||m.type;
        var lc=m.type==="pon"?"background:#fbeaf0;border-color:#d4537e;color:#72243e"
                :m.type==="chi"?"background:var(--tl-bg);border-color:var(--tl);color:var(--tl)"
                :"background:var(--a-bg);border-color:var(--a);color:var(--a-t)";
        return'<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border:.5px solid var(--bd);border-radius:var(--ra);margin-bottom:4px;background:var(--sf)">'
          +'<span style="font-size:10px;padding:2px 7px;border-radius:20px;border:.5px solid;'+lc+'">'+lbl+'</span>'
          +'<span style="font-size:20px">'+tilesWithNakiHTML(m.tiles,m.nakiIdx)+'</span>'
          +(m.from?'<span style="font-size:11px;color:var(--tx3)">'+m.from+'</span>':"")
          +(m.rinshanTile?'<span style="font-size:11px;color:var(--a-t)">嶺上:'+teHtml(m.rinshanTile)+'</span>':"")
          +(m.discTile?'<span style="font-size:11px;color:var(--tx3)">捨:'+teHtml(m.discTile)+'</span>':"")
          +(m.kanDoraTile?'<span style="font-size:11px;color:var(--gold)">カンドラ:'+teHtml(m.kanDoraTile)+'</span>':"")
          +(m.kanTsumoTile?'<span style="font-size:11px;color:var(--b)">カン前ツモ:'+teHtml(m.kanTsumoTile)+'</span>':"")
          +'<button onclick="state.melds.splice('+i+',1);renderNav();renderSection()" style="margin-left:auto;font-size:11px;padding:2px 7px;border-radius:4px;background:var(--r-bg);border:none;color:var(--r);cursor:pointer">削除</button>'
          +'</div>';
      }).join("")
      +'</div>'
    :"";

  // ─── ドラフト未作成: タイプ選択ボタン ───
  if(!d){
    var typeBtns=['pon','chi','kan'].map(function(type){
      var lbl={pon:"ポン",chi:"チー",kan:"カン"}[type];

  // ─── ドラフト進行中 ───

      opts=chiOptions(d.nakiTile);

  // STEP3: 嶺上牌（カンのみ）- スロット方式
  else if(d.step===3){
    body=kanSlotRow('rinshan','嶺上牌',d.rinshanTile,'meldPickRinshan');
  }

  // STEP4: 副露後の捨て牌
  else if(d.step===4){
    var discBtns2=myDiscards.length
      ? myDiscards.map(function(t,i){
          return'<div onclick="meldPickDisc(\''+t+'\','+i+')"'

      :"";
    body='<div style="font-size:11px;color:var(--tx3);margin-bottom:8px">副露後の捨て牌</div>'
      +(d.rinshanTile?'<div style="font-size:11px;color:var(--a-t);margin-bottom:6px">嶺上: '+te(d.rinshanTile)+'</div>':"")
      +(myDiscards.length?'<div style="font-size:10px;color:var(--tx3);margin-bottom:4px">入力済みの捨て牌から:</div>'

      +kanSlotRow('disc','直接入力',d.discTile,'meldPickDiscDirect');

  // STEP5: カンドラ（カンのみ）- スロット方式
  else if(d.step===5){
    body=kanSlotRow('kandora','カンドラ表示牌',d.kanDoraTile,'meldPickKandora')

      +'border-radius:var(--ra);border:.5px solid var(--bd2);background:var(--sf);cursor:pointer;font-size:12px;color:var(--tx3)">スキップ（不明）</button>';

  // STEP6: カン前ツモ牌（カンのみ）
  else if(d.step===6){
    // 入力済みツモ牌から選ぶ
    var myDraws=state.draws.map(function(t,i){return{tile:t,idx:i};}).filter(function(x){return x.tile;});
    var drawBtns=myDraws.length
      ?'<div style="font-size:10px;color:var(--tx3);margin-bottom:4px">入力済みツモ牌から選ぶ:</div>'
        +'<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px">'
        +myDraws.map(function(x){

            +' style="display:flex;flex-direction:column;align-items:center;gap:1px;'
            +'padding:4px 6px;border-radius:6px;border:.5px solid var(--bd2);'
            +'background:var(--sf);cursor:pointer;min-width:40px">'
            +'<span style="font-size:22px;line-height:1">'+teHtml(x.tile)+'</span>'
            +'<span style="font-size:9px;color:var(--tx3)">'+(x.idx+1)+'巡目</span>'
            +'</div>';
        }).join('')+'</div>'
      :'';
    body='<div style="font-size:11px;color:var(--tx3);margin-bottom:8px">カンを実行する直前のツモ牌</div>'

  var backBtn=d.step>1?'<button onclick="state.meldDraft.step--;renderSection()" style="font-size:12px;padding:4px 10px;border-radius:var(--ra);border:.5px solid var(--bd2);background:var(--sf);cursor:pointer;margin-bottom:10px;color:var(--tx3)">← 戻る</button><br>':"";
  var cancelBtn='<button onclick="state.meldDraft=null;renderSection()" style="font-size:11px;padding:4px 10px;border-radius:var(--ra);border:.5px solid var(--bd2);background:var(--sf);cursor:pointer;margin-top:10px;color:var(--tx3)">キャンセル</button>';

  return'<div class="card">'
    +'<div class="slabel">🔗 副露</div>'
    +meldList
    +'<div style="border:.5px solid var(--a);border-radius:var(--ral);padding:14px;background:var(--a-bg)">'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">'+typeBadge

    +(d.tiles?'<span style="font-size:20px">'+tilesWithNakiHTML(d.tiles,d.nakiIdx)+'</span>':"")
    +(d.rinshanTile?'<span style="font-size:12px;color:var(--a-t)">嶺上:'+te(d.rinshanTile)+'</span>':"")

  renderSection();
}
function meldPickNakiTile(tile,discIdx){

  state.meldDraft.nakiFromDiscIdx=discIdx!=null?discIdx:null;
  state.meldDraft.step=2;
  renderSection();
}
function meldPickNakiTileDirect(tile){
  meldPickNakiTile(tile,null);
}
function meldPickShapeIdx(oi){
  var opt=(window._meldOpts||[])[oi];

  state.meldDraft.tiles=opt.tiles;
  state.meldDraft.nakiIdx=opt.nakiIdx!=null?opt.nakiIdx:0;
  state.meldDraft.from=opt.from||"";

}

  if(typeof opt==="number"){meldPickShapeIdx(opt);return;}
  state.meldDraft.tiles=opt.tiles;
  state.meldDraft.nakiIdx=opt.nakiIdx!=null?opt.nakiIdx:0;
  state.meldDraft.from=opt.from||"";
  state.meldDraft.isAnkan=(opt.attr==="ankan");
  state.meldDraft.step=(state.meldDraft.type==="kan")?3:4;
  renderSection();
}

function kanSlotFocused(f){
  kanActiveField=f;
}

function kanSlotTextInput(input,pickFn){
  var v=input.value;
  if(!v)return;
  var tiles=parseTileText(v);
  if(tiles.length!==1)return;
  if(isTileComplete(v,tiles[0])){
    var fnMap={
      "meldPickRinshan":meldPickRinshan,
      "meldPickDiscDirect":meldPickDiscDirect,
      "meldPickKandora":meldPickKandora,
      "meldPickNakiTileDirect":meldPickNakiTileDirect,
      "meldPickKanTsumo":function(t){meldPickKanTsumo(t,null);},
    };
    if(fnMap[pickFn])fnMap[pickFn](tiles[0]);
  }
}

function kanSlotKeydown(e,input,fieldName,pickFn){
  if(e.key==="Enter"){
    e.preventDefault();
    var tiles=parseTileText(input.value);
    if(tiles.length){
      var fnMap={
        "meldPickRinshan":meldPickRinshan,
        "meldPickDiscDirect":meldPickDiscDirect,
        "meldPickKandora":meldPickKandora,
        "meldPickNakiTileDirect":meldPickNakiTileDirect,
      };
      if(fnMap[pickFn])fnMap[pickFn](tiles[0]);
    } else {
      // 空Enter → 次フィールドへ（カン系のみ）
      var order=["rinshan","disc","kandora"];
      var ni=order.indexOf(fieldName);
      if(ni>=0&&ni+1<order.length){
        var nextF=order[ni+1];
        var el=document.getElementById("kan-"+nextF);
        if(el){el.focus();}
      }
    }
  } else if(e.key==="Escape"){
    kanActiveField=null;
  }
}



function meldPickRinshan(tile){
  if(!tile){state.meldDraft.step=4;renderSection();return;}
  state.meldDraft.rinshanTile=tile;
  state.meldDraft.step=4;
  renderSection();
}
function meldPickDisc(tile,idx){
  state.meldDraft.discTile=tile;
  state.meldDraft.discTileIdx=idx!=null?idx:null;
  if(state.meldDraft.type==="kan"){
    state.meldDraft.step=5; // カンドラへ
  } else {
    meldFinish();
  }
  renderSection();
}
function meldPickDiscDirect(tile){meldPickDisc(tile,null);}
function meldPickKandora(tile){
  state.meldDraft.kanDoraTile=tile;
  // カンの場合はSTEP6（カン前ツモ牌）へ
  var d=state.meldDraft;
  var isKan=(d.type==='kan'||d.type==='ankan'||d.isAnkan);
  if(isKan){ d.step=6; renderSection(); } else { meldFinish(); }
}
function meldPickKanTsumo(tile, idx){
  state.meldDraft.kanTsumoTile = tile||null;
  state.meldDraft.kanTsumoIdx  = (idx!=null)?idx:null;
  meldFinish();
}

function meldFinish(){
  var d=state.meldDraft;
  state.melds.push({
    type:d.type,
    tiles:d.tiles||[d.nakiTile],
    nakiIdx:d.nakiIdx,
    nakiTile:d.nakiTile,
    nakiFromDiscIdx:d.nakiFromDiscIdx,
    from:d.from,
    isAnkan:d.isAnkan,
    rinshanTile:d.rinshanTile,
    discTile:d.discTile,
    discTileIdx:d.discTileIdx,
    kanDoraTile:d.kanDoraTile,
    kanTsumoTile:d.kanTsumoTile||null,
    kanTsumoIdx:d.kanTsumoIdx!=null?d.kanTsumoIdx:null,
  });
  state.meldDraft=null;
  // kanDoraTile が入力されていたら state.dora に自動反映
  (function(){
    var allKanDora=state.melds.filter(function(m){return m.kanDoraTile;}).map(function(m){return m.kanDoraTile;});
    // state.dora[0] は通常のドラ表示牌。カンドラは [1] 以降
    allKanDora.forEach(function(t,i){
      var slot=i+1; // 0番目は通常ドラなので1番目から
      if(slot < DORA_MAX){
        while(state.dora.length <= slot) state.dora.push(null);
        if(!state.dora[slot]) state.dora[slot]=t; // 未入力のときだけ反映
      }
    });
  })();
  renderNav();
  renderSection();
}

function applyTurnsText(){
  var drawInp=document.getElementById("turns-text-draw");
  var discInp=document.getElementById("turns-text-disc");
  if(drawInp&&drawInp.value.trim()){
    var dt=parseTileText(drawInp.value);
    dt.forEach(function(t,i){if(i<18)state.draws[i]=t;});
  }
  if(discInp&&discInp.value.trim()){
    var ds=parseTileText(discInp.value);
    ds.forEach(function(t,i){if(i<18)state.discards[i]=t;});
  }
  renderNav();
  renderSection();
}
