// ─── 点数計算エンジン ─────────────────────────
// ─── 入力矛盾チェック ────────────────────────
function checkInputConsistency(){
  var warnings=[];
  var ag=state.agari;
  var gf=state.gameFlow;
  var WJ=['東家','南家','西家','北家'];

  // リーチ宣言があるのにアガリ役にリーチがない
  if(state.riichiDiscIdx!==null && ag.yaku){
    var yakuList=ag.yaku.split(/[・,，、]/).map(function(s){return s.trim();});
    if(!yakuList.includes('リーチ')&&!yakuList.includes('ダブルリーチ')){
      warnings.push('⚠ リーチ宣言がありますが、役に「リーチ」が含まれていません');
    }
  }
  // 役にリーチがあるのに宣言牌が未選択
  if(ag.yaku){
    var yl=ag.yaku.split(/[・,，、]/).map(function(s){return s.trim();});
    if((yl.includes('リーチ')||yl.includes('ダブルリーチ'))&&state.riichiDiscIdx===null){
      warnings.push('⚠ 役に「リーチ」がありますが、リーチ宣言牌が選択されていません');
    }
  }
  // 場のリーチ棒が4本以上（4人麻雀の最大は4人全員リーチ）
  var totalRiichi=(state.riichiSticks||0)+(state.riichiDiscIdx!==null?1:0);
  if(totalRiichi>4){
    warnings.push('⚠ リーチ棒の合計が4本を超えています（4人麻雀では最大4本）');
  }
  // 流局なのに点数が入力されている
  if(ag.who==='流局'&&ag.score&&ag.score!==''){
    warnings.push('⚠ 流局なのに点数が入力されています');
  }
  // ツモなのに放銃者が選択されている
  if(ag.type==='ツモ'&&ag.from&&ag.from!==''){
    warnings.push('⚠ ツモアガリなのに放銃者が選択されています');
  }
  // ロンなのに放銃者が未選択
  if(ag.type==='ロン'&&(!ag.from||ag.from==='')){
    warnings.push('⚠ ロンアガリなのに放銃者が選択されていません');
  }
  // 本場の矛盾（本場があるのに前局データがない）
  var honba=(gf.selectedKyoku&&gf.selectedKyoku.honba)||0;
  if(honba>0&&(!gf.honbaHistory||!gf.honbaHistory[(gf.selectedKyoku.ba+'_'+gf.selectedKyoku.kyoku)])){
    // 警告レベル（エラーではない）
    // warnings.push('ℹ 本場が設定されていますが、前局の送信履歴がありません');
  }

  return warnings;
}

function calcScores(){
  // state.agari から各プレイヤーの点数変動を計算
  var gf=state.gameFlow;
  var _rules=getRules();
  var rule=_rules.find(function(r){return r.id===gf.rule;})||(_rules[0]||{startPts:30000,uma:[20,10,-10,-20],oka:20000});
  if(gf.rule==='custom'&&gf.customRule){var cr=gf.customRule;rule=Object.assign({},rule,{startPts:+(cr.startPts)||rule.startPts,uma:[+(cr.uma1)||0,+(cr.uma2)||0,+(cr.uma3)||0,+(cr.uma4)||0],oka:+(cr.oka)||0});}
  var WE=['east','south','west','north'];
  var WJ=['東家','南家','西家','北家'];
  var sm=state.seatMap||{};

  // 現在局の初期点数（scores タブで入力された値を優先。なければルールの初期値）
  var startPts={};
  WE.forEach(function(w){
    var entered=state.kyokuStartPts&&state.kyokuStartPts[w];
    startPts[w]=(entered!=null?parseInt(entered):null)||rule.startPts;
  });

  // 点数変動を計算
  var delta={east:0,south:0,west:0,north:0};
  var ag=state.agari;
  if(!ag.who||ag.who==='流局') return {delta:delta,startPts:startPts,endPts:startPts};

  var score=parseInt((ag.score||'0').replace(/[^0-9\-]/g,''))||0;
  var winnerJIdx=WJ.indexOf(ag.who);
  var winnerW=winnerJIdx>=0?WE[winnerJIdx]:null;

  // 本場・リーチ棒（供託は scores タブの kyokuCarryover を使用）
  var honba=(gf.selectedKyoku&&gf.selectedKyoku.honba)||0;
  var honbaBonus=honba*300;
  var myRiichi=(state.riichiDiscIdx!==null)?1:0;
  var riichiSticks=(state.kyokuCarryover||0)+myRiichi;
  var riichiBonus=riichiSticks*1000;

  if(ag.type==='ツモ'&&winnerW){
    // ツモ: 本場は各家から100点追加
    var payBase=Math.round(score/3);
    var honbaPay=Math.round(honbaBonus/3);
    WE.forEach(function(w){
      if(w===winnerW){
        delta[w]+=score+honbaBonus+riichiBonus;
        if(myRiichi) delta[w]-=1000; // 自分のリーチ棒は払い戻しに含まれているが供託から取る
      } else {
        delta[w]-=(payBase+honbaPay);
      }
    });
    if(myRiichi) delta[winnerW]+=0; // 自分の棒は既に riichiBonus に含む
  } else if(ag.type==='ロン'&&winnerW&&ag.from){
    var loserJIdx=WJ.indexOf(ag.from);
    var loserW=loserJIdx>=0?WE[loserJIdx]:null;
    if(loserW){
      var total=score+honbaBonus+riichiBonus;
      delta[winnerW]+=total;
      delta[loserW]-=(score+honbaBonus);
      if(myRiichi) delta[winnerW]-=1000;
    }
  }

  // 結果点数
  var endPts={};
  WE.forEach(function(w){ endPts[w]=(startPts[w]||rule.startPts)+delta[w]; });

  return {
    rule:    rule,
    delta:   delta,
    startPts:startPts,
    endPts:  endPts,
    winner:  winnerW,
    loser:   ag.from?(WE[WJ.indexOf(ag.from)]||null):null,
  };
}

// meld を再生アプリの rawToken 文字列に変換
function meldToRawToken(m){
  // 再生アプリの parseMelds が認識するトークン形式:
  // pon:発@1>3p  chi:5p6p7p@0>8p  kan:中@0>4s>7m  kan:北@ankan>2p>5s~5p
  var type = m.isAnkan ? 'kan' : m.type;
  var tiles = (m.tiles||[]).join('');
  var from  = m.from===null ? '' : String(m.from||0);
  var nakiFrom = m.isAnkan ? 'ankan' : from;
  var disc  = m.discTile  ? '>'+m.discTile+(m.discTileIdx!=null?'#'+m.discTileIdx:'') : '';
  var rinsh = m.rinshanTile ? '>'+m.rinshanTile : '';
  var kd    = m.kanDoraTile  ? '~'+m.kanDoraTile : '';
  return type+':'+tiles+'@'+nakiFrom+disc+rinsh+kd;
}

// ── v2.0 completeness計算 ──
// ╔══════════════════════════════════════════════════════════╗
// ║  § 18. v2.0 JSONフォーマット生成・統合                   ║
// ║                                                           ║
// ║  calcCompleteness(): 席ごとの入力完成度を0〜100で採点    ║
// ║    (haipai:10pt × 4席, discards:5pt × 4席 etc)          ║
// ║  mergeContribs(): 複数ユーザーの提出を matchKey で統合   ║
// ║  buildKifuJSON(): 現在の state から v2.0 JSON を生成     ║
// ║    → gameData（再生アプリ互換）+ contributions + match   ║
// ║  downloadKifuJSON(): 生成したJSONをファイルに保存        ║
// ╚══════════════════════════════════════════════════════════╝
function calcCompleteness(seatContribs, mySeat, myContrib){
  var result={};
  var totalScore=0;
  var PER_SEAT={haipai:10,discards:5,tsumo:3,finalHand:2};
  WE.forEach(function(w){
    var c=seatContribs[w];
    var d=c?c.data:null;
    var has={
      haipai:   !!(d&&d.haipai   &&d.haipai.length   >=13),
      discards: !!(d&&d.discards &&d.discards.length  >0),
      tsumo:    !!(d&&d.tsumo    &&d.tsumo.length     >0),
      finalHand:!!(d&&d.finalHand&&d.finalHand.length >0),
      melds:    !!(d&&d.melds    &&d.melds.length     >0),
    };
    var s=0;
    if(has.haipai)    s+=PER_SEAT.haipai;
    if(has.discards)  s+=PER_SEAT.discards;
    if(has.tsumo)     s+=PER_SEAT.tsumo;
    if(has.finalHand) s+=PER_SEAT.finalHand;
    result[w]=Object.assign({},has,{score:s});
    totalScore+=s;
  });
  var mc=myContrib?myContrib.data:null;
  var metaHas={
    agari:!!(mc&&mc.agari&&mc.agari.who),
    dora: !!(mc&&mc.meta &&mc.meta.dora_indicators),
    score:!!(mc&&mc.meta &&mc.meta.score),
  };
  var metaScore=0;
  if(metaHas.agari) metaScore+=12;
  if(metaHas.dora)  metaScore+=4;
  if(metaHas.score) metaScore+=4;
  result.meta=Object.assign({},metaHas,{score:metaScore});
  totalScore+=metaScore;
  result.total=Math.min(100,totalScore);
  return result;
}

// ── v2.0 contributions統合 ──
function mergeContribs(existingKifu, newContrib){
  if(!existingKifu) return null;
  var base=JSON.parse(JSON.stringify(existingKifu));
  if(!base.contributions) base.contributions=[];
  var seat=newContrib.seat;
  var userId=newContrib.userId;
  var found=false;
  base.contributions=base.contributions.map(function(c){
    if(c.seat===seat&&c.userId===userId){found=true;return newContrib;}
    return c;
  });
  if(!found) base.contributions.push(newContrib);
  var seatContribs={};
  WE.forEach(function(w){
    var candidates=base.contributions.filter(function(c){return c.seat===w;});
    if(!candidates.length){seatContribs[w]=null;return;}
    candidates.sort(function(a,b){return(b.submittedAt||'').localeCompare(a.submittedAt||'');});
    seatContribs[w]=candidates[0];
  });
  WE.forEach(function(w){
    var c=seatContribs[w];
    if(!c) return;
    var d=c.data||{};
    if(d.haipai   &&d.haipai.length   >=1) base.gameData.initHands[w]=d.haipai;
    if(d.discards &&d.discards.length  >0) base.gameData.discards[w] =d.discards;
    if(!base.gameData.players[w]) base.gameData.players[w]={};
    var pw=base.gameData.players[w];
    if(d.finalHand&&d.finalHand.length>0) pw.hand     =d.finalHand;
    if(d.tsumo    &&d.tsumo.length    >0) pw.tsumo    =d.tsumo;
    if(d.melds    &&d.melds.length    >0) pw.melds    =d.melds;
    if(d.wait     &&d.wait.length     >0) pw.wait     =d.wait;
    if(d.riichiDiscIdx>=0)                pw.riichiIdx=d.riichiDiscIdx;
  });
  var agariVotes={};
  base.contributions.forEach(function(c){
    var rt=(c.data&&c.data.meta)?c.data.meta.result_type:null;
    if(!rt) return;
    agariVotes[rt]=(agariVotes[rt]||0)+1;
  });
  var topRt=null,topCnt=0;
  Object.keys(agariVotes).forEach(function(rt){
    if(agariVotes[rt]>topCnt){topRt=rt;topCnt=agariVotes[rt];}
  });
  // ══════════════════════════════════════
  // 審議（dispute）検出 — 全フィールド比較
  // 同じ席に複数ユーザーが「異なる」データを送信した場合を検出
  // ══════════════════════════════════════
  var disputes=[];

  // ── ヘルパー ──
  function tileKey(arr){ return (arr||[]).slice().join(','); }
  function meldsKey(melds){
    return (melds||[]).map(function(m){
      return [m.type,tileKey(m.tiles),(m.nakiTile||''),(m.discTile||'')].join(':');
    }).sort().join('|');
  }
  function checkSeatField(w, fieldName, extractor, note){
    var candidates=base.contributions.filter(function(c){return c.seat===w;});
    if(candidates.length<2) return;
    var vals=candidates.map(extractor).filter(function(v){return v!==null&&v!==undefined&&v!=='';});
    if(vals.length<2) return;
    var unique=[...new Set(vals)];
    if(unique.length>1){
      disputes.push({seat:w, field:fieldName,
        count:candidates.length,
        note:WJ[WE.indexOf(w)]+'家の'+note+'が'+candidates.length+'人の入力で一致しません',
        values:unique.slice(0,3),
      });
    }
  }
  function checkMetaField(fieldName, extractor, note){
    var vals=base.contributions.map(extractor).filter(function(v){return v!==null&&v!==undefined&&v!=='';});
    if(vals.length<2) return;
    var unique=[...new Set(vals)];
    if(unique.length>1){
      disputes.push({seat:'meta', field:fieldName,
        count:vals.length,
        note:note+'が一致しません（'+unique.slice(0,3).join('・')+'）',
        values:unique.slice(0,3),
      });
    }
  }

  WE.forEach(function(w){
    // 1. 配牌（ソート後比較）
    checkSeatField(w,'haipai',function(c){
      return tileKey((c.data&&c.data.haipai||[]).slice().sort());
    },'配牌（13枚）');
    // 2. ツモ列（順序込み）
    checkSeatField(w,'tsumo',function(c){
      return tileKey(c.data&&c.data.tsumo||[]);
    },'ツモ列');
    // 3. 捨て牌列（順序込み）
    checkSeatField(w,'discards',function(c){
      return tileKey((c.data&&c.data.discards||[]).filter(Boolean));
    },'捨て牌列');
    // 4. 最終手牌
    checkSeatField(w,'finalHand',function(c){
      return tileKey((c.data&&c.data.finalHand||[]).slice().sort());
    },'最終手牌');
    // 5. 副露（種類・牌・切り牌）
    checkSeatField(w,'melds',function(c){
      return meldsKey(c.data&&c.data.melds||[]);
    },'副露情報');
    // 6. リーチ宣言位置
    checkSeatField(w,'riichiIdx',function(c){
      var idx=c.data&&c.data.riichiDiscIdx;
      return (idx!=null&&idx>=0)?String(idx):null;
    },'リーチ宣言牌の位置');
    // 7. 待ち牌
    checkSeatField(w,'wait',function(c){
      return tileKey((c.data&&c.data.wait||[]).slice().sort());
    },'待ち牌');
  });

  // 8. ドラ表示牌
  checkMetaField('dora',function(c){
    return tileKey(c.data&&c.data.meta&&c.data.meta.dora_indicators||[]);
  },'ドラ表示牌');
  // 9. 裏ドラ
  checkMetaField('uraDora',function(c){
    return tileKey(c.data&&c.data.meta&&c.data.meta.ura_dora_indicators||[]);
  },'裏ドラ表示牌');
  // 10. アガリ者
  checkMetaField('agari_who',function(c){return c.data&&c.data.agari&&c.data.agari.who||'';},'アガリ者');
  // 11. アガリ方法
  checkMetaField('agari_type',function(c){return c.data&&c.data.agari&&c.data.agari.type||'';},'アガリ方法');
  // 12. 放銃者
  checkMetaField('agari_from',function(c){
    if((c.data&&c.data.agari&&c.data.agari.type)!=='ロン') return null;
    return c.data.agari.from||'';
  },'放銃者');
  // 13. 点数
  checkMetaField('score',function(c){return c.data&&c.data.agari&&c.data.agari.score||'';},'アガリ点数');
  // 14. 役（ソート後比較）
  checkMetaField('yaku',function(c){
    var y=c.data&&c.data.agari&&c.data.agari.yaku||'';
    return y.split(/[・,，、]/).map(function(s){return s.trim();}).filter(Boolean).sort().join(',');
  },'役');
  // 15. 局情報
  checkMetaField('bakaze',function(c){return c.data&&c.data.meta&&c.data.meta.bakaze||'';},'場風');
  checkMetaField('kyoku',function(c){
    var k=c.data&&c.data.meta&&c.data.meta.kyoku; return k!=null?String(k):null;
  },'局数');

  // 重複除去（seat+field で1件に）
  base.disputes=disputes.filter(function(d,i){
    return disputes.findIndex(function(e){return e.seat===d.seat&&e.field===d.field;})===i;
  });

  if(topRt) base.gameData.meta.result_type=topRt;
  var latestContrib=base.contributions.reduce(function(a,b){
    return(a.submittedAt||'')>(b.submittedAt||'')?a:b;
  });
  base.completeness=calcCompleteness(seatContribs,seat,latestContrib);
  // 審議ありは complete にしない（手動解決が必要）
  if(disputes.length>0){
    base.status='disputed';
  } else {
    base.status=base.completeness.total>=100?'complete':'partial';
  }
  base.updatedAt=new Date().toISOString();
  return base;
}

function buildKifuJSON(){
  var gf=state.gameFlow;
  var gi=state.gameInfo||{};
  var org=ORGS.find(function(o){return o.id===gf.org;})||{label:''};
  var tour=(TOURNAMENTS[gf.org]||[]).find(function(t){return t.id===gf.tournament;})||{label:''};
  var allP=Object.values(PLAYERS_MASTER).flat();
  var sm=state.seatMap||{};
  var WJseats=['東家','南家','西家','北家'];

  var playersMap={},initHandsMap={},discardsMap={},playerScores={};
  WE.forEach(function(w,wi){
    var isMy=(w===(state.seat||''));
    var pid=sm[w]||(gf.players&&gf.players[wi]);
    var pInfo=pid?allP.find(function(x){return x.id===pid;}):null;
    var pName=pInfo?pInfo.name:WJseats[wi];

    initHandsMap[w] = isMy?(state.haipai||[]).slice():[];
    discardsMap[w]  = isMy?(state.discards||[]).filter(Boolean):[];

    var myMelds=isMy?(state.melds||[]).map(function(m){
      return{
        type:        m.isAnkan?'ankan':m.type,
        tiles:       m.tiles||[],
        nakiIdxFixed:m.nakiIdx!=null?m.nakiIdx:null,
        nakiTile:    m.nakiTile||null,
        nakiFromDiscIdx:m.nakiFromDiscIdx!=null?m.nakiFromDiscIdx:null,
        from:        m.from||'',
        isAnkan:     m.isAnkan||false,
        rinshanTile: m.rinshanTile||null,
        discTile:    m.discTile||null,
        discTileIdx: m.discTileIdx!=null?m.discTileIdx:null,
        kanDoraTile: m.kanDoraTile||null,
        kanTsumoTile:m.kanTsumoTile||null,
        rawToken:    meldToRawToken(m),
      };
    }):[];

    // riichiIdx: 自席のriichiDiscIdxをマッピング
    var riichiIdx=-1;
    if(isMy&&state.riichiDiscIdx!=null&&state.riichiDiscIdx>=0){
      riichiIdx=state.riichiDiscIdx;
    }

    playersMap[w]={
      hand:      isMy?(state.finalHand||[]).slice():[],
      melds:     myMelds,
      tsumo:     isMy?(state.draws||[]).filter(Boolean):[],
      riichiIdx: riichiIdx,
      wait:      isMy?(state.waitTiles||[]).filter(Boolean):[],
    };

    playerScores[w]={
      name:      pName,
      start:     state.kyokuStartPts&&state.kyokuStartPts[w]!=null?parseInt(state.kyokuStartPts[w]):null,
      end:       null,
      delta:     0,
      pointMode: false,
    };
  });

  var ag=state.agari||{};
  var isRyukyoku=(ag.who==='流局');
  var winnerW=null,loserW=null;
  if(!isRyukyoku&&ag.who){var wi2=WJseats.indexOf(ag.who);if(wi2>=0)winnerW=WE[wi2];}
  if(ag.from){var fi=WJseats.indexOf(ag.from);if(fi>=0)loserW=WE[fi];}
  var scoreNum=parseInt((ag.score||'').replace(/[^0-9]/g,''))||0;
  if(ag.score&&ag.score.startsWith('-'))scoreNum=-scoreNum;

  var tenpaiFlags={};
  if(isRyukyoku&&ag.tenpaiMap){
    WE.forEach(function(w,wi){tenpaiFlags[w]=!!(ag.tenpaiMap[WJseats[wi]]);});
  }

  var kanDoraList=state.melds.filter(function(m){return m.kanDoraTile;}).map(function(m){return m.kanDoraTile;});
  var doraIndicators=state.dora.length?state.dora.concat(kanDoraList):(gi.dora?parseTileText(gi.dora):null);
  var uraDoraIndicators=state.uraDora.length?state.uraDora:(gi.ura_dora?parseTileText(gi.ura_dora):null);

  var ky=gf.selectedKyoku||{};
  var bakaze=ky.ba||gi.bakaze||'東';
  var kyoku=ky.kyoku||parseInt(gi.kyoku)||1;
  var honba=ky.honba!=null?ky.honba:(parseInt(gi.honba)||0);
  var title=(org.label?org.label+' ':'')+( tour.label||'')+(gi.round?' '+gi.round:'');

  var gameData={
    meta:{
      title:               title||'無題',
      date:                gf.date||'',
      bakaze:              bakaze,
      kyoku:               kyoku,
      honba:               honba,
      dora_indicators:     doraIndicators&&doraIndicators.length?doraIndicators:null,
      dora_indicator:      doraIndicators&&doraIndicators.length?doraIndicators[0]:null,
      ura_dora_indicators: uraDoraIndicators&&uraDoraIndicators.length?uraDoraIndicators:null,
      result_type:         isRyukyoku?'ryukyoku':ag.type==='ツモ'?'tsumo':ag.type==='ロン'?'ron':'ryukyoku',
      winner:              winnerW,
      loser:               loserW,
      yaku:                ag.yaku?ag.yaku.split(/[・,，、]/).map(function(s){return s.trim();}).filter(Boolean):[],
      han:                 parseInt(gi.han)||0,
      fu:                  parseInt(gi.fu)||0,
      score:               scoreNum||null,
      confidence:          'crowd',
      ai_notes:            'ツモログ みんなの牌譜から生成',
      tenpai:              isRyukyoku&&Object.keys(tenpaiFlags).length?tenpaiFlags:null,
    },
    players:      playersMap,
    discards:     discardsMap,
    initHands:    initHandsMap,
    playerScores: playerScores,
  };

  var scoreReport=calcScores();
  WE.forEach(function(w){
    if(gameData.playerScores[w]){
      gameData.playerScores[w].start=scoreReport.startPts[w]||null;
      gameData.playerScores[w].end  =scoreReport.endPts[w]  ||null;
      gameData.playerScores[w].delta=scoreReport.delta[w]   ||0;
    }
  });

  // ── match ブロック（v2.0新規） ──
  var matchPlayers={};
  WE.forEach(function(w,wi){
    var pid2=sm[w]||(gf.players&&gf.players[wi])||'';
    var pI2=pid2?allP.find(function(x){return x.id===pid2;}):null;
    matchPlayers[w]={
      id:       pid2,
      name:     pI2?pI2.name:WJseats[wi],
      isPro:    pI2?!!pI2.isPro:false,
      isPlayer: pI2?!!pI2.isPlayer:false,
    };
  });

  var matchKey=makeMatchKey(gf,sm);
  var uid=(function(){
    try{var u=JSON.parse(localStorage.getItem('tsumolog_user')||'null');return u&&u.id?u.id:null;}catch(e){return null;}
  })();
  var contribId='c_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);

  var contrib={
    contribId:    contribId,
    userId:       uid,
    seat:         state.seat||null,
    matchKey:     matchKey,
    submittedAt:  new Date().toISOString(),
    source:       'tsumolog_input',
    completeness: calcCompletion(),
    data:{
      meta:          gameData.meta,
      haipai:        initHandsMap[state.seat||'east']||[],
      tsumo:         (state.draws||[]).filter(Boolean),
      discards:      discardsMap[state.seat||'east']||[],
      finalHand:     (state.finalHand||[]).slice(),
      wait:          (state.waitTiles||[]).filter(Boolean),
      melds:         playersMap[state.seat||'east']?playersMap[state.seat||'east'].melds:[],
      riichiDiscIdx: state.riichiDiscIdx!=null?state.riichiDiscIdx:-1,
      agari:         ag,
    },
  };

  var now=new Date().toISOString();
  var seatContribsInit={east:null,south:null,west:null,north:null};
  if(state.seat) seatContribsInit[state.seat]=contrib;

  return{
    // v2.0フィールド
    version:   '2.0',
    kifuId:    makeKifuId(gf),
    status:    'partial',
    matchKey:  matchKey,
    createdAt: now,
    updatedAt: now,
    match:{
      title:      title||'無題',
      date:       gf.date||'',
      org:        gf.org||'',
      orgLabel:   org.label||'',
      tournament: gf.tournament||'',
      tournLabel: tour.label||'',
      rule:scoreReport.rule?{
        id:       scoreReport.rule.id,
        label:    scoreReport.rule.label,
        startPts: scoreReport.rule.startPts,
        uma:      scoreReport.rule.uma,
        oka:      scoreReport.rule.oka||0,
      }:null,
      players:    matchPlayers,
      kyokuInfo:  {bakaze:bakaze,kyoku:kyoku,honba:honba,carryover:state.kyokuCarryover||0},
    },
    // v1互換（再生アプリがそのまま読める）
    gameData:  gameData,
    contributions:[contrib],
    completeness:  calcCompleteness(seatContribsInit,state.seat||null,contrib),
    score_report:{
      rule:     scoreReport.rule?{id:scoreReport.rule.id,label:scoreReport.rule.label}:null,
      startPts: scoreReport.startPts,
      delta:    scoreReport.delta,
      endPts:   scoreReport.endPts,
      uma:      scoreReport.rule?scoreReport.rule.uma:null,
    },
    score_log:(gf.scoreLog||[]).map(function(entry){
      return{kyoku:entry.kyoku,result:entry.result,startPts:entry.startPts,delta:entry.delta,endPts:entry.endPts};
    }),
    savedAt:now,
    source: 'tsumolog_input',
  };
}

function downloadKifuJSON(){
  var obj=buildKifuJSON();
  var gf=state.gameFlow;
  var tour=(TOURNAMENTS[gf.org]||[]).find(function(t){return t.id===gf.tournament;})||{label:"kifu"};
  var fname="mahjong_"+(gf.date||"nodate")+"_"+(tour.label||"kifu")+".json";
  var blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url; a.download=fname;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ╔══════════════════════════════════════════════════════════╗
// ║  § 19. 送信・ポイント付与                                ║
// ║  submitAll(): バリデーション → ポイント計算 → 完了モーダル║
// ║  calcAndGrantPoints(): 入力内容に応じてポイントを付与     ║
// ╚══════════════════════════════════════════════════════════╝
function submitAll(){
  calcAndGrantPoints().then(function(totalPts){
    // ── 1. 牌譜JSONを生成・保存 ──
    var kifuObj=buildKifuJSON();
    localStorage.setItem('tsumolog_last_kifu', JSON.stringify(kifuObj,null,2));
    try{
      var hist=JSON.parse(localStorage.getItem('tsumolog_kifu_history')||'[]');
      hist.unshift({savedAt:kifuObj.savedAt,title:kifuObj.gameData.meta.title||'無題',json:kifuObj});
      if(hist.length>20) hist=hist.slice(0,20);
      localStorage.setItem('tsumolog_kifu_history',JSON.stringify(hist));
    }catch(e){}

    // ── 2. IDB に提出・マージ（TsumologLibrary v2） ──
    TsumologLibrary.submitContrib(kifuObj, function(kifuId, status){
      if(kifuId) console.log('[submit] kifuId='+kifuId+' status='+status);
    });

    // ── 3. 今送信した席データをブラウザ内に保持 ──
    //    state.submittedSeats: 送信済み席 → contribデータのマップ
    if(!state.submittedSeats) state.submittedSeats={};
    if(state.seat){
      state.submittedSeats[state.seat]={
        seat:       state.seat,
        haipai:     state.haipai.slice(),
        draws:      state.draws.slice(),
        discards:   state.discards.slice(),
        finalHand:  state.finalHand.slice(),
        waitTiles:  state.waitTiles.slice(),
        melds:      JSON.parse(JSON.stringify(state.melds)),
        agari:      Object.assign({},state.agari),
        submittedAt:new Date().toISOString(),
      };
    }

    // ── 4. 本場・供託リーチ棒の引き継ぎ ──
    try{
      var ky=state.gameFlow.selectedKyoku||{ba:'東',kyoku:1,honba:0};
      if(!state.gameFlow.honbaHistory) state.gameFlow.honbaHistory={};
      var hkey=ky.ba+'_'+ky.kyoku;
      var prev=state.gameFlow.honbaHistory[hkey]||0;
      if(ky.honba>prev) state.gameFlow.honbaHistory[hkey]=ky.honba;

      var scoreResult=calcScores();
      if(!state.gameFlow.scoreLog) state.gameFlow.scoreLog=[];
      state.gameFlow.scoreLog.push({
        kyoku:    state.gameFlow.selectedKyoku||{ba:'東',kyoku:1,honba:0},
        startPts: scoreResult.startPts,
        endPts:   scoreResult.endPts,
        delta:    scoreResult.delta,
        result:   state.agari.who+(state.agari.type?' '+state.agari.type:''),
      });

      var isRyukyoku=(state.agari.who==='流局');
      var myRiichiStick=(state.riichiDiscIdx!==null)?1:0;
      var totalRiichiOut=(state.kyokuCarryover||0)+myRiichiStick;
      if(isRyukyoku){
        state.gameFlow.riichiCarryover=(state.gameFlow.riichiCarryover||0)+totalRiichiOut;
      } else {
        state.gameFlow.riichiCarryover=0;
      }
    }catch(e){}

    // ── 5. done-modal の表示更新 ──
    var el=document.getElementById('done-json-link');
    if(el){
      var pct=calcCompletion();
      var mergedStatus='';
      // IDB からマージ状況を確認して表示
      TsumologLibrary.getMergedByKey(kifuObj.matchKey, function(list){
        var merged=list&&list[0];
        var total=merged&&merged.completeness&&merged.completeness.total!=null
          ? merged.completeness.total : pct;
        var statusColor=total>=100?'var(--g)':total>=50?'var(--b)':'var(--gold)';
        el.innerHTML=
          '<div style="background:var(--b-bg);border-radius:var(--ra);padding:10px 14px;margin-bottom:8px;text-align:left">'
          +'<div style="font-size:11px;color:var(--tx3);margin-bottom:4px">この局の統合完成度</div>'
          +'<div style="height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:6px">'
            +'<div style="height:100%;width:'+total+'%;background:'+statusColor+';border-radius:3px;transition:width .4s"></div>'
          +'</div>'
          +'<div style="font-size:13px;font-weight:700;color:'+statusColor+'">'+total+'%'
            +(total>=100?' ✅ 完成':'')
          +'</div>'
          +'<div style="font-size:11px;color:var(--tx3);margin-top:2px">'
            +(total>=100?'ショップでダウンロード可能になりました':'他の席の入力でさらに完成度が上がります')
          +'</div>'
          +'</div>'
          +(totalPts>0
            ?'<div style="background:var(--g-bg);border:.5px solid var(--g);border-radius:var(--ra);padding:8px 12px;font-size:13px;color:var(--g);font-weight:600">⭐ +'+totalPts+'pt 獲得！</div>'
            :'');
      });
    }

    // ── 編集モードの場合: 送信後に paifu-play へ戻る準備 ──
    var returnTo=state.gameFlow.editReturnTo||null;
    var editKifuId=state.gameFlow.editKifuId||null;
    if(returnTo){
      try{
        localStorage.setItem('tsumolog_edit_return', JSON.stringify({
          kifuId:  editKifuId,
          gameData:(function(){
            try{ return buildKifuJSON().gameData; }catch(e){ return null; }
          })(),
          returnedAt: new Date().toISOString(),
        }));
      }catch(e){}
    }

    // ── 6. 別席入力ボタンを生成 ──
    _renderDoneSeatBtns();

    // 編集モードの「再生アプリへ戻る」ボタンを先頭に追加
    if(returnTo){
      setTimeout(function(){
        var sb=document.getElementById('done-seat-btns');
        if(sb){
          var retBtn='<a href="'+returnTo+'" style="display:block;width:100%;padding:12px 14px;border-radius:var(--ra);'
            +'background:var(--g);border:none;color:#fff;font-size:14px;font-weight:700;'
            +'text-align:center;text-decoration:none;box-sizing:border-box;margin-bottom:8px;">▶ 再生アプリで確認する</a>';
          sb.insertAdjacentHTML('afterbegin', retBtn);
        }
      }, 50);
    }

    TsumologPoints.refreshDisplay();
    clearDraft();
    document.body.classList.remove('is-input');
    document.getElementById('done-modal').classList.add('open');
  });
}

// ─ 完了した項目に応じてポイントを付与 ─
function calcAndGrantPoints(){
  var pts = 0;
  var tasks = [];
  var note = buildGameNote();

  // points.csv (POINT_TABLE) に基づいてポイント計算
  var tbl = POINT_TABLE.length ? POINT_TABLE : POINT_TABLE_FALLBACK;
  var idMap = {};
  tbl.forEach(function(row){ idMap[row.id||row.task] = +row.pts||0; });

  // 各タスクチェック
  if(state.seatMap && Object.values(state.seatMap).some(Boolean)){
    var p=idMap['player_pos']||2; pts+=p; tasks.push({task:'player_pos',pts:p});
  }
  if(state.haipai && state.haipai.length){
    var p=idMap['haipai']||3; pts+=p; tasks.push({task:'haipai',pts:p});
  }
  var drawCount=state.draws.filter(Boolean).length;
  if(drawCount>0){
    // 1巡ごとにpts
    var ppb=idMap['turn']||1;
    var p=ppb*drawCount; pts+=p; tasks.push({task:'turn',pts:p,note:drawCount+'巡'});
  }
  if(state.melds && state.melds.length){
    var ppb=idMap['meld']||3;
    var p=ppb*state.melds.length; pts+=p; tasks.push({task:'meld',pts:p,note:state.melds.length+'副露'});
  }
  if((state.finalHand&&state.finalHand.length)||(state.waitTiles&&state.waitTiles.filter(Boolean).length)){
    var p=idMap['final_wait']||3; pts+=p; tasks.push({task:'final_wait',pts:p});
  }
  if(state.agari && (state.agari.who||state.agari.type)){
    var p=idMap['agari']||3; pts+=p; tasks.push({task:'agari',pts:p});
  }

  if(pts===0) return Promise.resolve(0);

  // まとめて付与
  return TsumologPoints.grant('submit_game', pts, note).then(function(result){
    console.log('Points granted:', result);
    return pts;
  });
}

function buildGameNote(){
  var parts=[];
  if(state.gameFlow.tournament) parts.push(state.gameFlow.tournament);
  if(state.agari && state.agari.who) parts.push(state.agari.who+' '+state.agari.type);
  return parts.join(' ');
}

// 編集モード初期化: paifu-play から渡された gameData を state に展開
function _initEditMode(){
  var raw=null;
  try{ raw=localStorage.getItem('tsumolog_edit_payload'); }catch(e){}
  if(!raw){
    // ペイロードがない → 通常起動にフォールバック
    renderNav(); setSection("game"); renderRanking(); renderAccount(); startRtDemo(); TsumologPoints.refreshDisplay();
    return;
  }
  var payload=null;
  try{ payload=JSON.parse(raw); }catch(e){}
  // ペイロードは読んだら消す
  try{ localStorage.removeItem('tsumolog_edit_payload'); }catch(e){}

  if(!payload||!payload.gameData){
    renderNav(); setSection("game"); renderRanking(); renderAccount(); startRtDemo(); TsumologPoints.refreshDisplay();
    return;
  }

  var gd=payload.gameData;
  var meta=gd.meta||{};

  // ── gameData → state に展開 ──
  // gameFlow（対局情報）を復元
  state.gameFlow.matched=true;
  state.gameFlow.date=meta.date||'';
  state.gameFlow.selectedKyoku={
    ba:   meta.bakaze||'東',
    kyoku:meta.kyoku||1,
    honba:meta.honba||0,
  };
  // playerScores から seatMap を復元
  var ps=gd.playerScores||{};
  // プレイヤー名からIDを逆引き（なければ名前をそのまま使う）
  var allP=Object.values(PLAYERS_MASTER).flat();
  WE.forEach(function(w){
    var pname=(ps[w]&&ps[w].name)||'';
    var found=allP.find(function(x){return x.name===pname;});
    state.seatMap[w]=found?found.id:null;
  });

  // 初期手牌・ツモ・捨て・副露・最終手牌・アガリを展開
  var initH=gd.initHands||{};
  var players=gd.players||{};
  var discards=gd.discards||{};

  // 入力対象の席を東家に設定（後でプレイヤー別タブで切り替え可能）
  state.seat='east';

  // 全4席分を submittedSeats に展開（既に「送信済み」扱いにする）
  state.submittedSeats={};
  WE.forEach(function(w){
    var pw=players[w]||{};
    if((initH[w]&&initH[w].length)||
       (discards[w]&&discards[w].length)||
       (pw.tsumo&&pw.tsumo.length)){
      state.submittedSeats[w]={
        seat:     w,
        haipai:   (initH[w]||[]).slice(),
        draws:    (pw.tsumo||[]).slice(),
        discards: (discards[w]||[]).slice(),
        finalHand:(pw.hand||[]).slice(),
        waitTiles:(pw.wait||[]).slice(),
        melds:    JSON.parse(JSON.stringify(pw.melds||[])),
        agari:    {},
        submittedAt: new Date().toISOString(),
      };
    }
  });

  // 東家の牌譜データを現在の state に展開（最初に東家を編集対象とする）
  var ew=players.east||{};
  state.haipai   = (initH.east||[]).slice();
  state.draws    = (ew.tsumo   ||new Array(18).fill(null)).concat(new Array(18).fill(null)).slice(0,18);
  state.discards = (discards.east||new Array(18).fill(null)).concat(new Array(18).fill(null)).slice(0,18);
  state.finalHand= (ew.hand||[]).slice();
  state.waitTiles= (ew.wait||[]).slice();
  state.melds    = JSON.parse(JSON.stringify(ew.melds||[]));
  state.riichiIdx= ew.riichiIdx||null;

  // ドラ
  if(meta.dora_indicators&&meta.dora_indicators.length){
    state.dora=meta.dora_indicators.slice();
  }
  if(meta.ura_dora_indicators&&meta.ura_dora_indicators.length){
    state.uraDora=meta.ura_dora_indicators.slice();
  }

  // アガリ
  var winner=meta.winner;
  var WJseatsMap={east:'東家',south:'南家',west:'西家',north:'北家'};
  if(winner){
    state.agari={
      type:  meta.result_type==='tsumo'?'ツモ':meta.result_type==='ron'?'ロン':'',
      who:   WJseatsMap[winner]||'',
      from:  meta.loser?WJseatsMap[meta.loser]||'':'',
      yaku:  (meta.yaku||[]).join('・'),
      score: meta.score?String(meta.score):'',
    };
  }

  // 点数・供託
  WE.forEach(function(w){
    var s=ps[w]&&ps[w].start!=null?ps[w].start:null;
    state.kyokuStartPts[w]=s;
  });

  // returnTo を保持（送信後に戻るため）
  state.gameFlow.editReturnTo=payload.returnTo||null;
  state.gameFlow.editKifuId  =payload.kifuId  ||null;
  state.gameFlow.matchKey    =state.gameFlow.matchKey||'';

  // URLのクエリパラメータをきれいにする
  history.replaceState(null,'',location.pathname);

  // 通知バナー
  showEditModeBanner(payload.returnTo);

  // 入力画面へ
  document.body.classList.add('is-input');
  state.bigTab='player';
  state.section='haipai';
  renderNav();
  renderSection();
  renderRanking();
  renderAccount();
  TsumologPoints.refreshDisplay();
}

// 編集モード中のバナーを表示
function showEditModeBanner(returnTo){
  var banner=document.getElementById('edit-mode-banner');
  if(!banner) return;
  banner.style.display='flex';
  // 「← 再生に戻る」: 現在の編集データを localStorage に書いてから遷移
  banner.innerHTML='<span>✏️ <strong>編集モード</strong> — 修正して送信すると再生アプリに反映されます</span>'
    +'<button onclick="_backToPlay()" style="margin-left:auto;font-size:11px;padding:3px 10px;border-radius:5px;'
    +'background:none;border:1px solid rgba(255,255,255,.4);color:#fff;cursor:pointer;white-space:nowrap;flex-shrink:0;">← 再生に戻る</button>';
  // returnTo を関数から参照できるようグローバルに保持
  window._editReturnTo = returnTo || null;
}

function _backToPlay(){
  // 現在の編集データを tsumolog_edit_return に書いてから戻る
  try{
    // まず現在の席データを submittedSeats に保存
    if(state.seat){
      state.submittedSeats[state.seat]={
        seat:      state.seat,
        haipai:    state.haipai.slice(),
        draws:     state.draws.slice(),
        discards:  state.discards.slice(),
        finalHand: state.finalHand.slice(),
        waitTiles: state.waitTiles.slice(),
        melds:     JSON.parse(JSON.stringify(state.melds)),
        agari:     Object.assign({},state.agari),
        submittedAt: new Date().toISOString(),
      };
    }

    // 全4席のデータを統合した gameData を組み立てる
    var gd = null;
    try{
      var base = buildKifuJSON(); // 現在席のデータが入ったベース
      // submittedSeats の全席データで上書き
      WE.forEach(function(w){
        var saved = state.submittedSeats[w];
        if(!saved) return;
        base.gameData.initHands[w]  = (saved.haipai   ||[]).slice();
        base.gameData.discards[w]   = (saved.discards ||[]).filter(Boolean);
        base.gameData.players[w]    = base.gameData.players[w]||{};
        base.gameData.players[w].tsumo    = (saved.draws    ||[]).filter(Boolean);
        base.gameData.players[w].hand     = (saved.finalHand||[]).slice();
        base.gameData.players[w].wait     = (saved.waitTiles||[]).slice();
        base.gameData.players[w].melds    = JSON.parse(JSON.stringify(saved.melds||[]));
        if(saved.riichiDiscIdx!=null && saved.riichiDiscIdx>=0)
          base.gameData.players[w].riichiIdx = saved.riichiDiscIdx;
      });
      gd = base.gameData;
    }catch(e){ console.warn('_backToPlay buildKifuJSON error',e); }

    localStorage.setItem('tsumolog_edit_return', JSON.stringify({
      kifuId:      state.gameFlow.editKifuId || null,
      gameData:    gd,
      returnedAt:  new Date().toISOString(),
    }));
  }catch(e){}
  // 戻り先へ遷移
  var dest = window._editReturnTo;
  if(dest) location.href = dest;
  else     history.back();
}

loadAllCSV();



// ══════════════════════════════════════════════════════════════
//  TsumologLibrary v2 — 共有IndexedDB + BroadcastChannel
//  DB: tsumolog_shared v2 / stores: library, kifu_submissions, kifu_merged
// ══════════════════════════════════════════════════════════════
// ╔══════════════════════════════════════════════════════════╗
// ║  § 22. TsumologLibrary（共有IndexedDB管理モジュール）     ║
// ║                                                           ║
// ║  DB: tsumolog_shared  (v2)                                ║
// ║  ストア:                                                  ║
// ║    library          — 再生アプリ用保存（旧ストア・互換）   ║
// ║    kifu_submissions  — ユーザーごとの提出ログ              ║
// ║    kifu_merged       — matchKeyで統合された牌譜            ║
// ║                                                           ║
// ║  主要API:                                                 ║
// ║    submitContrib(kifuV2Obj, cb)                           ║
// ║      → 提出を保存し、既存データとマージ                   ║
// ║    getPublicMerged(cb)                                    ║
// ║      → status:"complete" の牌譜一覧（ショップ用）         ║
// ║    getAllMerged(cb)                                        ║
// ║      → 全統合牌譜（管理者用）                             ║
// ╚══════════════════════════════════════════════════════════╝
var TsumologLibrary = (function(){
  var DB_NAME   = 'tsumolog_shared';
  var DB_VER    = 2;
  var STORE_LIB = 'library';
  var STORE_SUB = 'kifu_submissions';
  var STORE_MRG = 'kifu_merged';
  var _db  = null;
  var _bc  = null;

  try{ _bc=new BroadcastChannel('tsumolog_library'); }catch(e){ _bc=null; }

  function _broadcast(type,data){
    if(_bc) try{_bc.postMessage({type:type,data:data});}catch(e){}
  }

  function _open(cb){
    if(_db){cb(_db);return;}
    var req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=function(e){
      var db=e.target.result;
      if(!db.objectStoreNames.contains(STORE_LIB)){
        var sL=db.createObjectStore(STORE_LIB,{keyPath:'id',autoIncrement:true});
        sL.createIndex('source','source',{unique:false});
        sL.createIndex('userId','userId',{unique:false});
        sL.createIndex('savedAt','savedAt',{unique:false});
      }
      if(!db.objectStoreNames.contains(STORE_SUB)){
        var sS=db.createObjectStore(STORE_SUB,{keyPath:'contribId'});
        sS.createIndex('matchKey','matchKey',{unique:false});
        sS.createIndex('userId','userId',{unique:false});
        sS.createIndex('seat','seat',{unique:false});
        sS.createIndex('submittedAt','submittedAt',{unique:false});
      }
      if(!db.objectStoreNames.contains(STORE_MRG)){
        var sM=db.createObjectStore(STORE_MRG,{keyPath:'kifuId'});
        sM.createIndex('matchKey','matchKey',{unique:false});
        sM.createIndex('status','status',{unique:false});
        sM.createIndex('updatedAt','updatedAt',{unique:false});
      }
    };
    req.onsuccess=function(e){_db=e.target.result;cb(_db);};
    req.onerror=function(){console.warn('[TsumologLibrary] IDB open failed');cb(null);};
  }

  function _userId(){
    try{var u=JSON.parse(localStorage.getItem('tsumolog_user')||'null');return(u&&u.id)?u.id:null;}catch(e){return null;}
  }

  // ── 旧API（library store・後方互換） ──
  function add(gameDataObj,opts,cb){
    var uid  =_userId();
    var meta =(gameDataObj.gameData||gameDataObj).meta||{};
    var label=opts.label||meta.title||(meta.bakaze||'')+(meta.kyoku||'')+'局';
    var perms=opts.permissions||(uid?[uid]:[]);
    var record={
      source:      opts.source||'replay',
      label:       label,
      filename:    opts.filename||'',
      userId:      uid,
      permissions: perms,
      savedAt:     new Date().toISOString(),
      savedAtDisp: new Date().toLocaleString('ja-JP'),
      data:        JSON.stringify(gameDataObj),
    };
    _open(function(db){
      if(!db){cb&&cb(null);return;}
      var tx=db.transaction(STORE_LIB,'readwrite');
      var req=tx.objectStore(STORE_LIB).add(record);
      req.onsuccess=function(){_broadcast('added',{id:req.result,source:record.source,label:label});cb&&cb(req.result);};
      req.onerror=function(){cb&&cb(null);};
    });
  }

  function getAll(opts,cb){
    var uid=_userId();
    _open(function(db){
      if(!db){cb([]);return;}
      var req=db.transaction(STORE_LIB,'readonly').objectStore(STORE_LIB).getAll();
      req.onsuccess=function(){
        var all=req.result||[];
        if(opts&&opts.source) all=all.filter(function(r){return r.source===opts.source;});
        if(opts&&opts.onlyMine){
          all=all.filter(function(r){
            if(!uid)return false;
            return r.userId===uid||(r.permissions&&r.permissions.indexOf(uid)>=0);
          });
        }
        cb(all.reverse());
      };
      req.onerror=function(){cb([]);};
    });
  }

  function get(id,cb){
    var uid=_userId();
    _open(function(db){
      if(!db){cb(null,'db_error');return;}
      var req=db.transaction(STORE_LIB,'readonly').objectStore(STORE_LIB).get(id);
      req.onsuccess=function(){
        var r=req.result;
        if(!r){cb(null,'not_found');return;}
        var ok=uid&&(r.userId===uid||(r.permissions&&r.permissions.indexOf(uid)>=0));
        if(!ok){cb(null,'no_permission');return;}
        cb(r,null);
      };
      req.onerror=function(){cb(null,'db_error');};
    });
  }

  function grantPermission(id,targetUserId,cb){
    _open(function(db){
      if(!db){cb&&cb(false);return;}
      var tx=db.transaction(STORE_LIB,'readwrite');
      var store=tx.objectStore(STORE_LIB);
      var req=store.get(id);
      req.onsuccess=function(){
        var r=req.result;if(!r){cb&&cb(false);return;}
        if(!r.permissions)r.permissions=[];
        if(r.permissions.indexOf(targetUserId)<0)r.permissions.push(targetUserId);
        var upd=store.put(r);
        upd.onsuccess=function(){_broadcast('permission_granted',{id:id,userId:targetUserId});cb&&cb(true);};
        upd.onerror=function(){cb&&cb(false);};
      };
    });
  }

  function remove(id,cb){
    _open(function(db){
      if(!db){cb&&cb();return;}
      var tx=db.transaction(STORE_LIB,'readwrite');
      tx.objectStore(STORE_LIB).delete(id);
      tx.oncomplete=function(){_broadcast('deleted',{id:id});cb&&cb();};
    });
  }

  function getPublic(cb){
    _open(function(db){
      if(!db){cb([]);return;}
      var req=db.transaction(STORE_LIB,'readonly').objectStore(STORE_LIB).index('source').getAll('input');
      req.onsuccess=function(){cb((req.result||[]).reverse());};
      req.onerror=function(){cb([]);};
    });
  }

  function onUpdate(fn){
    if(_bc)_bc.onmessage=function(e){fn(e.data);};
  }

  // ── 新APIv2: submitContrib ──
  function submitContrib(kifuV2Obj,cb){
    if(!kifuV2Obj||!kifuV2Obj.contributions||!kifuV2Obj.contributions[0]){cb&&cb(null);return;}
    var contrib  =kifuV2Obj.contributions[0];
    var matchKey =kifuV2Obj.matchKey;
    var kifuIdNew=kifuV2Obj.kifuId;
    contrib.matchKey=matchKey;
    _open(function(db){
      if(!db){cb&&cb(null);return;}
      var txS=db.transaction(STORE_SUB,'readwrite');
      txS.objectStore(STORE_SUB).put(contrib);
      txS.oncomplete=function(){
        var txM=db.transaction(STORE_MRG,'readonly');
        var idxReq=txM.objectStore(STORE_MRG).index('matchKey').getAll(matchKey);
        idxReq.onsuccess=function(){
          var existing=idxReq.result||[];
          var baseKifu=existing.length>0?JSON.parse(existing[0].json):null;
          var merged;
          if(!baseKifu){
            merged=JSON.parse(JSON.stringify(kifuV2Obj));
          } else {
            merged=mergeContribs(baseKifu,contrib);
          }
          if(!merged)merged=JSON.parse(JSON.stringify(kifuV2Obj));
          var finalKifuId=(baseKifu&&baseKifu.kifuId)?baseKifu.kifuId:kifuIdNew;
          merged.kifuId=finalKifuId;
          var mrgRecord={
            kifuId:   finalKifuId,
            matchKey: matchKey,
            status:   merged.status||'partial',
            disputeCount: (merged.disputes||[]).length,
            updatedAt:new Date().toISOString(),
            json:     JSON.stringify(merged),
          };
          var txW=db.transaction(STORE_MRG,'readwrite');
          txW.objectStore(STORE_MRG).put(mrgRecord);
          txW.oncomplete=function(){
            _broadcast('merged',{kifuId:finalKifuId,status:mrgRecord.status,matchKey:matchKey});
            cb&&cb(finalKifuId,merged.status);
          };
          txW.onerror=function(){cb&&cb(null);};
        };
        idxReq.onerror=function(){cb&&cb(null);};
      };
      txS.onerror=function(){cb&&cb(null);};
    });
  }

  function getMerged(kifuId,cb){
    _open(function(db){
      if(!db){cb(null);return;}
      var req=db.transaction(STORE_MRG,'readonly').objectStore(STORE_MRG).get(kifuId);
      req.onsuccess=function(){
        var r=req.result;if(!r){cb(null);return;}
        try{cb(JSON.parse(r.json));}catch(e){cb(null);}
      };
      req.onerror=function(){cb(null);};
    });
  }

  function getMergedByKey(matchKey,cb){
    _open(function(db){
      if(!db){cb([]);return;}
      var req=db.transaction(STORE_MRG,'readonly').objectStore(STORE_MRG).index('matchKey').getAll(matchKey);
      req.onsuccess=function(){
        var all=(req.result||[]).map(function(r){try{return JSON.parse(r.json);}catch(e){return null;}}).filter(Boolean);
        cb(all);
      };
      req.onerror=function(){cb([]);};
    });
  }

  function getPublicMerged(cb){
    _open(function(db){
      if(!db){cb([]);return;}
      var req=db.transaction(STORE_MRG,'readonly').objectStore(STORE_MRG).index('status').getAll('complete');
      req.onsuccess=function(){
        var all=(req.result||[]).map(function(r){try{return JSON.parse(r.json);}catch(e){return null;}}).filter(Boolean);
        all.sort(function(a,b){return(b.updatedAt||'').localeCompare(a.updatedAt||'');});
        cb(all);
      };
      req.onerror=function(){cb([]);};
    });
  }

  function getAllMerged(cb){
    _open(function(db){
      if(!db){cb([]);return;}
      var req=db.transaction(STORE_MRG,'readonly').objectStore(STORE_MRG).getAll();
      req.onsuccess=function(){
        var all=(req.result||[]).map(function(r){try{return JSON.parse(r.json);}catch(e){return null;}}).filter(Boolean);
        all.sort(function(a,b){return(b.updatedAt||'').localeCompare(a.updatedAt||'');});
        cb(all);
      };
      req.onerror=function(){cb([]);};
    });
  }

  // 未完成（partial + disputed）の牌譜一覧
  function getIncompleteMerged(cb){
    _open(function(db){
      if(!db){cb([]);return;}
      var req=db.transaction(STORE_MRG,'readonly').objectStore(STORE_MRG).getAll();
      req.onsuccess=function(){
        var all=(req.result||[]).map(function(r){try{return JSON.parse(r.json);}catch(e){return null;}}).filter(Boolean);
        var incomplete=all.filter(function(k){return k.status==='partial'||k.status==='disputed';});
        incomplete.sort(function(a,b){return(b.updatedAt||'').localeCompare(a.updatedAt||'');});
        cb(incomplete);
      };
      req.onerror=function(){cb([]);};
    });
  }

  return{
    add:add, getAll:getAll, get:get, getPublic:getPublic,
    grantPermission:grantPermission, remove:remove, onUpdate:onUpdate, userId:_userId,
    submitContrib:submitContrib, getMerged:getMerged, getMergedByKey:getMergedByKey,
    getPublicMerged:getPublicMerged, getAllMerged:getAllMerged,
    getIncompleteMerged:getIncompleteMerged,
  };
})();


// ══════════════════════════════════════════════
// 【入力アプリ連携】submitAll 後に共有IDBへ保存（v2.0）
// ══════════════════════════════════════════════
(function(){
  function _patchSubmitAll(){
    var orig=window.submitAll;
    window.submitAll=function(){
      orig.apply(this,arguments);
      setTimeout(function(){
        try{
          var obj=buildKifuJSON(); // v2.0フォーマット
          if(!obj||!obj.gameData) return;
          var m=obj.gameData.meta||{};
          var label=m.title||((m.bakaze||'')+(m.kyoku||'')+'局');
          // 旧libraryストアにも保存（後方互換）
          TsumologLibrary.add(obj,{source:'input',label:label},function(id){
            if(id) console.log('[TsumologLibrary] library saved id='+id);
          });
          // v2: kifu_submissions + kifu_merged に保存・マージ
          TsumologLibrary.submitContrib(obj,function(kifuId,status){
            if(!kifuId){console.warn('[TsumologLibrary] submitContrib failed');return;}
            console.log('[TsumologLibrary] merged kifuId='+kifuId+' status='+status);
            if(status==='complete'){
              console.info('[TsumologLibrary] 🎉 kifuId='+kifuId+' が complete になりました！');
            }
          });
        }catch(e){console.warn('[TsumologLibrary] submitAll patch error',e);}
      },300);
    };
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',_patchSubmitAll);
  } else {
    setTimeout(_patchSubmitAll,0);
  }
})();
